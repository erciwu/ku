<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橘子导航</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ================= 基础 ================= */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Microsoft YaHei','PingFang SC',system-ui,sans-serif}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--page-bg);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  color:var(--txt);
  transition:background .3s ease, color .3s ease;
}
:root{
  --brand:#0A57C7;
  --brand-dark:#0846A8;
  --page-bg:#f0f4f8;
  --surface:#ffffff;
  --surface-2:#f8faff;
  --surface-3:#f0f4fa;
  --line:#e2e8f0;
  --line-2:#d0dcec;
  --txt:#1e2f40;
  --txt-2:#5f6f82;
  --txt-3:#a0b0c0;
  --shadow:0 8px 20px rgba(0,0,0,.05);
  --shadow-h:0 4px 14px rgba(0,0,0,.07);
  --ico-bg:#E8F1FF;
  --ico-color:#0A57C7;
  --ico-border:#d3e4fb;
  --dock-sh:0 -4px 20px rgba(0,0,0,.04);
}
body[data-theme="cloud"]{--page-bg:#f0f4f8;--surface:#fff;--surface-2:#f8faff;--surface-3:#f0f4fa}
body[data-theme="white"]{--page-bg:#f7f8fa;--surface:#fff;--surface-2:#fbfcfe;--surface-3:#f2f4f8}
body[data-theme="blue"]{--page-bg:#eaf1fa;--surface:#fff;--surface-2:#f5f9ff;--surface-3:#eaf2fc}

body[data-mode="dark"]{
  --page-bg:#0f1117;
  --surface:#1a1d24;
  --surface-2:#14171d;
  --surface-3:#232730;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.14);
  --txt:#e6e8ee;
  --txt-2:rgba(230,232,238,.55);
  --txt-3:rgba(230,232,238,.3);
  --ico-bg:rgba(30,90,200,.22);
  --ico-color:#7cb0ff;
  --ico-border:rgba(124,176,255,.22);
  --shadow:0 8px 20px rgba(0,0,0,.4);
  --shadow-h:0 4px 14px rgba(0,0,0,.5);
  --dock-sh:0 -4px 24px rgba(0,0,0,.45);
}

/* ================= 外容器 ================= */
.container{
  max-width:1800px;width:100%;
  margin:0 auto;
  display:flex;flex-direction:column;
  height:95vh;
  background:var(--surface);
  border-radius:24px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* ================= 顶栏 ================= */
.topbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:64px;
  background:var(--brand);
  border-bottom:1px solid rgba(255,255,255,.12);
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.logo{
  width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;font-size:19px;
  background:linear-gradient(145deg,#FFB84D,#FF8A3D);
  box-shadow:0 4px 10px rgba(255,140,60,.24),inset 0 1px 0 rgba(255,255,255,.55);
}
.brand h1{font-size:16.5px;font-weight:700;color:#fff;letter-spacing:.3px;white-space:nowrap}
.top-divider{width:1px;height:26px;background:rgba(255,255,255,.25);flex:0 0 auto}

.quick-links{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;
  position:relative;padding:3px;border-radius:10px;
  transition:background .15s ease, box-shadow .15s ease;
}
.quick-links.drop-target{
  background:rgba(255,255,255,.14);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);
}
.quick-item{
  width:33px;height:33px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.24);
  color:#fff;font-size:12.5px;font-weight:700;
  text-decoration:none;position:relative;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
}
.quick-item:hover{transform:translateY(-2px);background:rgba(255,255,255,.3);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.quick-item:active{transform:translateY(0) scale(.95)}
.quick-item .quick-del{
  position:absolute;top:-4px;right:-4px;
  width:16px;height:16px;border-radius:50%;
  background:#e05252;color:#fff;border:none;
  font-size:11px;line-height:1;font-weight:700;
  display:grid;place-items:center;cursor:pointer;
  font-family:inherit;box-shadow:0 2px 4px rgba(0,0,0,.2);z-index:2;
  transition:transform .15s ease;
}
.quick-item .quick-del:hover{transform:scale(1.15)}
.quick-add-hint{
  font-size:11px;color:rgba(255,255,255,.6);
  white-space:nowrap;padding-left:4px;
  border-left:1px dashed rgba(255,255,255,.35);
  margin-left:4px;line-height:1.3;max-width:100px;
}

.baidu-search{
  flex:1 1 auto;max-width:420px;
  position:relative;display:flex;align-items:center;
  margin:0 4px;
}
.baidu-search .search-ico{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  color:#8a9bb0;font-size:13px;pointer-events:none;
}
.baidu-search input{
  width:100%;height:37px;border-radius:19px;
  border:1px solid transparent;
  background:rgba(255,255,255,.94);
  color:#1e2f40;font-size:13.5px;
  padding:0 80px 0 39px;outline:none;font-family:inherit;
  transition:background .16s ease, box-shadow .16s ease;
}
.baidu-search input::placeholder{color:#8a9bb0}
.baidu-search input:focus{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28)}
.baidu-search button{
  position:absolute;right:3px;top:50%;transform:translateY(-50%);
  height:29px;padding:0 15px;border-radius:15px;border:none;
  background:var(--brand-dark);color:#fff;
  font-family:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;transition:background .15s ease;
}
.baidu-search button:hover{background:#063a8a}

.stats-inline{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  font-size:12px;color:rgba(255,255,255,.82);
  white-space:nowrap;margin-left:auto;
}
.stats-inline b{color:#fff;font-weight:700;font-size:12.5px}
.stats-inline .dot{color:rgba(255,255,255,.4)}
.clock-inline{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:rgba(255,255,255,.9);
  font-variant-numeric:tabular-nums;letter-spacing:.5px;
}
.clock-inline i{font-size:11px;opacity:.7}

.header-tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.htool{
  width:34px;height:34px;border-radius:9px;
  display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);
  color:#fff;font-family:inherit;font-size:14px;
  transition:background .15s ease, border-color .15s ease, transform .15s ease, color .15s ease;
}
.htool:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.36);transform:translateY(-1px)}
.htool:active{transform:translateY(0) scale(.95)}
.htool.on{background:#fff;border-color:#fff;color:var(--brand)}

/* ================= 主体 ================= */
.main-content{display:flex;flex:1;overflow:hidden;background:var(--surface-2)}

.sidebar{
  width:230px;flex:0 0 230px;
  background:var(--surface);
  border-right:1px solid var(--line);
  padding:16px 13px;
  overflow-y:auto;
}
.date-display{
  background:var(--ico-bg);
  padding:10px 14px;border-radius:16px;
  margin-bottom:14px;
  color:var(--ico-color);font-weight:500;
  display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;border:1px solid var(--ico-border);
}

.category-list{list-style:none}
.category-item{margin-bottom:3px}
.category-link{
  display:flex;align-items:center;gap:9px;
  padding:8px 12px;border-radius:24px;
  color:var(--txt);text-decoration:none;
  font-size:13px;font-weight:500;
  transition:background .15s ease,color .15s ease;
  background:transparent;border:1px solid transparent;
  cursor:pointer;
}
.category-link:hover{background:var(--surface-3);border-color:var(--line-2)}
.category-link.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.category-link.active i{color:#fff}
.category-link.active .category-count{background:rgba(255,255,255,.3);color:#fff;border-color:rgba(255,255,255,.3)}
.category-link i{width:17px;font-size:13.5px;color:var(--txt-2);text-align:center;flex:0 0 17px}
.category-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category-count{
  margin-left:auto;
  background:var(--surface-3);padding:2px 8px;border-radius:20px;
  font-size:11px;color:var(--txt-2);
  border:1px solid var(--line-2);flex:0 0 auto;
}

.websites-container{flex:1;padding:16px 22px 28px;overflow-y:auto;background:var(--surface-2);scroll-behavior:smooth}
.category-section{margin-bottom:22px;scroll-margin-top:8px}
.category-section:last-child{margin-bottom:0}

.category-header{
  font-size:16px;font-weight:700;
  margin:0 0 10px 0;padding-bottom:6px;
  color:var(--txt);display:flex;align-items:center;gap:9px;
  border-bottom:2px solid var(--line-2);
}
.category-header i{
  background:var(--ico-bg);
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--ico-color);flex:0 0 32px;
  border:1px solid var(--ico-border);
}
.category-header .cat-title-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category-header .cat-title-input{
  flex:1;min-width:0;
  font-family:inherit;font-size:16px;font-weight:700;color:var(--txt);
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:8px;padding:3px 10px;outline:none;
}
.category-header .cat-title-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,87,199,.12)}
.category-header .cat-tools{display:flex;gap:4px;flex:0 0 auto}
.cat-mini-btn{
  width:24px;height:24px;border-radius:7px;
  display:grid;place-items:center;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);
  color:var(--txt-2);font-family:inherit;font-size:13px;
  transition:.14s;
}
.cat-mini-btn:hover{background:var(--surface-3);border-color:var(--line-2);color:var(--txt)}
.cat-mini-btn.danger:hover{background:#c96b6b;border-color:#c96b6b;color:#fff}

.websites-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:10px;min-height:40px;
}
.websites-grid.drop-end{
  outline:2px dashed var(--brand);
  outline-offset:4px;border-radius:10px;
}

.website-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px 14px;
  display:flex;align-items:center;gap:12px;
  min-height:72px;
  transition:box-shadow .18s ease,border-color .18s ease,opacity .18s ease,
             min-height .2s ease, padding .2s ease;
  cursor:default;
}
.website-card:hover{border-color:var(--line-2);box-shadow:var(--shadow-h)}

.website-icon{
  width:44px;height:44px;flex:0 0 44px;border-radius:50%;
  display:grid;place-items:center;
  font-size:16px;font-weight:700;
  color:var(--ico-color);
  background:var(--ico-bg);
  border:1px solid var(--ico-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  transition:width .2s ease, height .2s ease, font-size .2s ease;
}
.website-info{flex:1;min-width:0}
.website-name{
  font-size:14px;font-weight:600;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;
}
.website-url{
  font-size:11px;color:var(--txt-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.website-actions{
  display:flex;align-items:center;gap:6px;
  flex:0 0 auto;margin-left:2px;
}
.visit-btn{
  background:var(--brand);
  border:1px solid var(--brand-dark);
  padding:6px 13px;border-radius:20px;
  font-size:12px;font-weight:600;color:#fff;
  cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:background .15s ease;
  font-family:inherit;white-space:nowrap;
  flex:0 0 auto;
}
.visit-btn:hover{background:var(--brand-dark)}
.visit-btn i{font-size:10px}

.visit-count{
  display:inline-block;
  min-width:62px;text-align:center;
  font-size:10.5px;padding:3px 8px;border-radius:20px;
  font-weight:600;white-space:nowrap;
  font-variant-numeric:tabular-nums;
  background:var(--surface-3);
  color:var(--txt-2);
  border:1px solid var(--line-2);
  flex:0 0 auto;
}
.visit-count.has-visit{
  background:rgba(31,112,68,.12);
  color:#2e9e64;
  border-color:rgba(46,158,100,.28);
}
body[data-mode="dark"] .visit-count.has-visit{
  background:rgba(46,158,100,.16);
  color:#5ad08e;
  border-color:rgba(90,208,142,.3);
}

.website-card.editing{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);
  border:1px solid var(--line-2);
  padding:9px 11px;min-height:68px;
  cursor:grab;position:relative;
}
.website-card.editing:hover{box-shadow:none;border-color:var(--line-2)}
.website-card.editing:active{cursor:grabbing}
.website-card.editing.dragging{opacity:.4}
.website-card.editing.insert-before{box-shadow:-3px 0 0 0 var(--brand)}
.website-card.editing.insert-after{box-shadow:3px 0 0 0 var(--brand)}
.website-card.editing .website-icon{
  width:34px;height:34px;flex:0 0 34px;font-size:12.5px;
  pointer-events:none;
}
.edit-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.edit-fields input{
  font-family:inherit;font-size:12.5px;color:var(--txt);
  background:var(--surface-3);border:1px solid transparent;
  border-radius:6px;padding:4px 8px;outline:none;min-width:0;transition:.14s;
  cursor:text;
}
.edit-fields input::placeholder{color:var(--txt-3)}
.edit-fields input:focus{background:var(--surface);border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,87,199,.1)}
.edit-fields .e-n{font-weight:600}
.edit-fields .e-u{font-size:11px;color:var(--txt-2)}
.e-del{
  width:26px;height:26px;flex:0 0 26px;border-radius:7px;
  display:grid;place-items:center;cursor:pointer;
  background:rgba(190,110,110,.1);border:1px solid rgba(190,110,110,.2);
  color:#c07a7a;font-family:inherit;font-size:14px;transition:.14s;
}
.e-del:hover{background:#c96b6b;color:#fff;border-color:#c96b6b}

.add-card{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 14px;border-radius:15px;
  border:1.5px dashed var(--line-2);
  background:transparent;color:var(--txt-3);
  font-family:inherit;font-size:12.5px;font-weight:520;
  cursor:pointer;transition:.15s;min-height:72px;
}
.add-card:hover{border-color:var(--brand);color:var(--brand);background:var(--surface)}

.no-results{
  text-align:center;padding:70px 20px;color:var(--txt-2);font-size:15px;
  background:var(--surface);border-radius:20px;border:1px solid var(--line);
}
.no-results i{font-size:48px;margin-bottom:14px;color:var(--txt-3);display:block}

/* ================= 卡片密度 ================= */
body[data-density="compact"] .website-card{
  min-height:56px;padding:8px 12px;gap:10px;border-radius:12px;
}
body[data-density="compact"] .website-icon{
  width:36px;height:36px;flex:0 0 36px;font-size:13.5px;
}
body[data-density="compact"] .website-name{font-size:13px}
body[data-density="compact"] .website-url{font-size:10px}
body[data-density="compact"] .visit-btn{padding:5px 10px;font-size:11px;border-radius:16px}
body[data-density="compact"] .visit-count{font-size:10px;min-width:56px;padding:2px 7px}
body[data-density="compact"] .websites-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
body[data-density="compact"] .category-section{margin-bottom:18px}
body[data-density="compact"] .add-card{min-height:56px;padding:8px 12px;border-radius:12px}

/* ================= 底部 Dock ================= */
.dock{
  flex:0 0 auto;height:64px;
  display:flex;align-items:center;gap:14px;
  padding:0 24px;
  background:var(--surface);
  border-top:1px solid var(--line);
  box-shadow:var(--dock-sh);
  position:relative;z-index:10;
}
.dock-label{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--txt-2);
  white-space:nowrap;padding-right:14px;
  border-right:1px solid var(--line);
}
.dock-label i{font-size:11px;opacity:.7}
.dock-items{
  flex:1 1 auto;min-width:0;
  display:flex;align-items:center;gap:7px;
  overflow-x:auto;scrollbar-width:none;
  padding:4px 0;
}
.dock-items::-webkit-scrollbar{display:none}

.dock-item{
  flex:0 0 auto;
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--ico-bg);
  border:1px solid var(--ico-border);
  color:var(--ico-color);
  font-size:14px;font-weight:700;
  text-decoration:none;cursor:pointer;position:relative;
  transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
.dock-item:hover{
  transform:translateY(-4px) scale(1.05);
  box-shadow:0 8px 16px rgba(10,87,199,.24);
}
.dock-item:active{transform:translateY(-2px) scale(1.02)}

@keyframes dock-bounce{
  0%   { transform: translateY(-4px) scale(1.05); }
  35%  { transform: translateY(-10px) scale(1.18); }
  65%  { transform: translateY(-6px) scale(1.1); }
  100% { transform: translateY(-4px) scale(1.05); }
}
.dock-item.bouncing{
  animation: dock-bounce .4s cubic-bezier(.34,1.56,.64,1);
}

.dock-empty{font-size:12px;color:var(--txt-3);padding-left:4px}

.dock-extra{
  flex:0 0 auto;
  display:flex;align-items:center;gap:14px;
  padding-left:14px;margin-left:2px;
  border-left:1px solid var(--line);
  height:34px;user-select:none;
}
.year-block{
  display:flex;align-items:center;gap:7px;
  font-size:11px;color:var(--txt-2);
  font-weight:500;white-space:nowrap;cursor:default;
}
.year-label{font-weight:600;opacity:.85}
.year-bar{
  width:70px;height:5px;border-radius:3px;
  background:var(--line);overflow:hidden;position:relative;
}
.year-fill{
  position:absolute;top:0;left:0;bottom:0;
  width:0%;
  background:linear-gradient(90deg,#2C7AE6,#0A57C7);
  border-radius:3px;
  transition:width .6s ease;
}
.year-pct{
  color:var(--brand);font-weight:700;
  font-variant-numeric:tabular-nums;font-size:11px;
  min-width:32px;text-align:right;
}
body[data-mode="dark"] .year-pct{color:var(--ico-color)}

.dock-sep{width:1px;height:22px;background:var(--line);flex:0 0 auto}

/* 工作时间胶囊 */
.work-block{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--txt-2);
  font-weight:500;white-space:nowrap;
  cursor:pointer;padding:5px 10px;border-radius:16px;
  transition:background .15s ease;
  border:1px solid transparent;
}
.work-block:hover{background:var(--surface-3);border-color:var(--line-2)}
.work-block i{font-size:11px;color:var(--brand)}
.work-block b{
  color:var(--brand);font-weight:700;
  font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.3px;
}
.work-block .worktime{
  color:var(--txt);font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:.2px;
}
.work-block .work-dot{opacity:.35;margin:0 1px}
body[data-mode="dark"] .work-block i,
body[data-mode="dark"] .work-block b{color:var(--ico-color)}

.work-block.before i,
.work-block.before b{color:#6b7a8f}
body[data-mode="dark"] .work-block.before i,
body[data-mode="dark"] .work-block.before b{color:rgba(230,232,238,.5)}

.work-block.done i,
.work-block.done b{color:#2e9e64}
.work-block.weekend i,
.work-block.weekend b{color:#d97706}

/* ================= 回到顶部 ================= */
.back-top{
  position:fixed;right:28px;bottom:84px;z-index:80;
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:var(--brand);color:#fff;border:none;
  box-shadow:0 6px 16px rgba(10,87,199,.35);

function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function buildDefault(){
  return {
    theme: 'cloud',
    folders: DEFAULT_FOLDERS.map(f => ({
      id: uid(),
      key: f.key,
      name: f.name,
      icon: f.icon,
      sites: f.sites.map(s => ({ n: s.n, u: s.u }))
    }))
  };
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.folders) && d.folders.length){
        d.folders.forEach(f => {
          if(!f.id) f.id = uid();
          if(!f.key) f.key = f.id;
          if(!f.icon) f.icon = 'fas fa-folder';
          if(!Array.isArray(f.sites)) f.sites = [];
        });
        if(!d.theme || !THEMES[d.theme]) d.theme = 'cloud';
        return d;
      }
    }
  }catch(e){}
  return buildDefault();
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function first(str){
  const c = (str || '?').trim()[0] || '?';
  return /[a-zA-Z]/.test(c) ? c.toUpperCase() : c;
}
function domain(u){
  try{ return new URL(u).hostname.replace(/^www\./, ''); }catch(e){ return u || ''; }
}
function allSites(){
  return state.folders.flatMap(f => f.sites);

   5. 深色 / 浅色模式（三态：auto / light / dark）
   ========================================================= */
const MODE_ORDER = ['auto', 'light', 'dark'];
const MODE_ICONS = {
  auto : 'fas fa-circle-half-stroke',
  light: 'fas fa-sun',
  dark : 'fas fa-moon'
};
const MODE_LABELS = {
  auto : '主题：跟随系统',
  light: '主题：浅色',
  dark : '主题：深色'
};

function currentMode(){
  try{ return localStorage.getItem(MODE_KEY) || 'auto'; }catch(e){ return 'auto'; }
}

function effectiveMode(setting){
  if(setting === 'auto'){
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  return setting;
}

function applyMode(setting){
  if(MODE_ORDER.indexOf(setting) === -1) setting = 'auto';
  const eff = effectiveMode(setting);
  document.body.dataset.mode = eff;
  const icon = document.querySelector('#btnMode i');
  if(icon) icon.className = MODE_ICONS[setting];
  const btn = document.getElementById('btnMode');
  if(btn) btn.title = MODE_LABELS[setting] + '（点击切换）';
  try{ localStorage.setItem(MODE_KEY, setting); }catch(e){}
}

function initMode(){
  applyMode(currentMode());
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const handler = () => {
    if(currentMode() === 'auto') applyMode('auto');
  };
  if(mq.addEventListener) mq.addEventListener('change', handler);

}

/* =========================================================
   8. 最近访问
   ========================================================= */
function getRecent(){
  try{
    const raw = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    return Array.isArray(raw) ? raw : [];
  }catch(e){ return []; }
}
function setRecent(arr){
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(arr.slice(0, MAX_RECENT))); }catch(e){}
}
function pushRecent(url){
  const sites = allSites();
  const s = sites.find(x => x.u === url);
  if(!s) return;
  const arr = getRecent().filter(r => r.u !== url);
  arr.unshift({ u: url, n: s.n, t: Date.now() });
  setRecent(arr);
  renderDock();
}
function renderDock(){
  const el = document.getElementById('dockItems');
  if(!el) return;
  const arr = getRecent();
  const sites = allSites();
  const valid = arr.filter(r => sites.some(s => s.u === r.u)).slice(0, DOCK_SHOW);

  if(!valid.length){
    el.innerHTML = '<span class="dock-empty">访问过的网站会出现在这里</span>';
    return;
  }
  el.innerHTML = valid.map(r => {
    const s = sites.find(x => x.u === r.u);
    const name = s ? s.n : r.n;
    return `<a class="dock-item" href="${esc(r.u)}" data-url="${esc(r.u)}" title="${esc(name)}">${esc(first(name))}</a>`;
  }).join('');
}

/* =========================================================
   9. 今日访问计数
   ========================================================= */
function getToday(){ return new Date().toDateString(); }

function getVisitedMap(){
  try{
    const raw = JSON.parse(localStorage.getItem('juzi-visited') || '{}');
    const out = {};
    for(const url in raw){
      const v = raw[url];
      if(typeof v === 'string'){
        out[url] = { date: v, count: 1 };
      }else if(v && typeof v === 'object'){
        out[url] = { date: v.date || '', count: v.count || 0 };
      }
    }
    return out;
  }catch(e){ return {}; }
}
function setVisitedMap(m){
  try{ localStorage.setItem('juzi-visited', JSON.stringify(m)); }catch(e){}
}
function getTodayCount(url){
  const map = getVisitedMap();
  const rec = map[url];
  return (rec && rec.date === getToday()) ? (rec.count || 0) : 0;
}
function markVisited(url){
  const map = getVisitedMap();
  const today = getToday();
  const rec = map[url];
  if(rec && rec.date === today){
    rec.count = (rec.count || 0) + 1;
  }else{
    map[url] = { date: today, count: 1 };
  }
  setVisitedMap(map);
  updateVisitedStat();
}
function getTotalTodayCount(){
  const map = getVisitedMap();
  const today = getToday();
  let sum = 0;
  for(const url in map){
    const rec = map[url];
    if(rec && rec.date === today) sum += (rec.count || 0);
  }
  return sum;
}
function updateVisitedStat(){
  document.getElementById('stat-visited').textContent = getTotalTodayCount();
}

/* =========================================================
   11. 年度进度
   ========================================================= */
function updateYearProgress(){
  const now = new Date();
  const year = now.getFullYear();
  const start = new Date(year, 0, 1).getTime();
  const end   = new Date(year + 1, 0, 1).getTime();
  const pct = ((now.getTime() - start) / (end - start)) * 100;

  document.getElementById('yearFill').style.width = pct.toFixed(2) + '%';
  document.getElementById('yearPct').textContent = pct.toFixed(0) + '%';

  const totalDays = Math.round((end - start) / 86400000);
  const passedDays = Math.floor((now.getTime() - start) / 86400000) + 1;
  const leftDays = totalDays - passedDays;
  document.getElementById('yearBlock').title =
    `${year} 年已过 ${passedDays} 天，还剩 ${leftDays} 天`;
}

/* =========================================================
   12. 工作时间 + 倒计时
   ========================================================= */
function loadOffWork(){
  try{
    const raw = localStorage.getItem(OFFWORK_KEY);
    if(raw){
      const [h, m] = raw.split(':').map(Number);
      if(!isNaN(h) && !isNaN(m)){ offWorkHour = h; offWorkMin = m; }
    }
  }catch(e){}
  updateWorkTitle();
}
function saveOffWork(){
  try{ localStorage.setItem(OFFWORK_KEY, `${offWorkHour}:${offWorkMin}`); }catch(e){}
  updateWorkTitle();
}
function updateWorkTitle(){
  const block = document.getElementById('workBlock');
  if(block){
    block.title = `上班 08:30 · 下班 ${String(offWorkHour).padStart(2,'0')}:${String(offWorkMin).padStart(2,'0')}（点击切换）`;
  }
}

function updateWork(){
  const block = document.getElementById('workBlock');
  const icon  = document.getElementById('offworkIcon');
  const text  = document.getElementById('offworkText');
  const timeEl= document.getElementById('worktime');
  if(!block || !icon || !text) return;

  const offStr = `${String(offWorkHour).padStart(2,'0')}:${String(offWorkMin).padStart(2,'0')}`;
  if(timeEl) timeEl.textContent = `08:30–${offStr}`;

  const now = new Date();
  const day = now.getDay();

  /* 周末 */
  if(day === 0 || day === 6){
    block.classList.remove('done', 'before');
    block.classList.add('weekend');
    icon.className = 'fas fa-mug-hot';
    text.innerHTML = '<b>周末愉快</b>';
    return;
  }
  block.classList.remove('weekend');

  const start = new Date(now); start.setHours(WORK_START_H, WORK_START_M, 0, 0);
  const end   = new Date(now); end.setHours(offWorkHour, offWorkMin, 0, 0);
  const pad = n => String(n).padStart(2, '0');

  if(now < start){
    /* 上班前 */
    const diff = start.getTime() - now.getTime();
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    block.classList.remove('done');
    block.classList.add('before');
    icon.className = 'fas fa-coffee';
    text.innerHTML = `距上班 <b>${pad(h)}:${pad(m)}:${pad(s)}</b>`;
  }else if(now < end){
    /* 工作中 */
    const diff = end.getTime() - now.getTime();
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    block.classList.remove('done', 'before');
    icon.className = h > 0 ? 'fas fa-hourglass-half' : 'fas fa-hourglass-end';
    text.innerHTML = `距下班 <b>${pad(h)}:${pad(m)}:${pad(s)}</b>`;
  }else{
    /* 已下班 */
    block.classList.add('done');
    block.classList.remove('before');
    icon.className = 'fas fa-mug-hot';
    text.innerHTML = '<b>已下班</b>';
  }
}
function bindWorkClick(){
  const block = document.getElementById('workBlock');
  if(!block) return;
  block.addEventListener('click', () => {
    const curIdx = OFFWORK_OPTIONS.findIndex(([h,m]) => h === offWorkHour && m === offWorkMin);
    const nextIdx = (curIdx + 1) % OFFWORK_OPTIONS.length;
    [offWorkHour, offWorkMin] = OFFWORK_OPTIONS[nextIdx];
    saveOffWork();
    updateWork();
  });
}

/* =========================================================
   16. 打开网站
   ========================================================= */
function openSite(url, cardEl){
  markVisited(url);
  pushRecent(url);
  window.open(url, '_blank', 'noopener,noreferrer');
  if(cardEl){
    const count = getTodayCount(url);
    const badge = cardEl.querySelector('.visit-count');
    if(badge){
      badge.textContent = `今日 ${count} 次`;
      badge.classList.toggle('has-visit', count > 0);
    }
  }
}

/* =========================================================
   17. 内容区点击
   ========================================================= */
document.getElementById('sections').addEventListener('click', e => {
  const btn = e.target.closest('.visit-btn');
  if(btn && !editMode){
    e.preventDefault();
    e.stopPropagation();
    openSite(btn.dataset.url, btn.closest('.website-card'));
    return;
  }

  if(editMode){
    const del = e.target.closest('.e-del');
    if(del){
      const f = state.folders.find(x => x.id === del.dataset.fid);
      if(!f) return;
      f.sites.splice(+del.dataset.i, 1);
      save();
      renderSidebar();
      renderSections();
      return;
    }

    const add = e.target.closest('[data-add]');
    if(add){
      const f = state.folders.find(x => x.id === add.dataset.add);
      if(!f) return;
      f.sites.push({ n:'新网站', u:'https://' });
      save();
      renderSidebar();
      renderSections();
      setTimeout(() => {
        const inputs = document.querySelectorAll(`.website-card.editing .e-n[data-fid="${f.id}"]`);
        const last = inputs[inputs.length - 1];
        if(last){
          last.focus(); last.select();
          last.scrollIntoView({ block:'center', behavior:'smooth' });
        }
      }, 30);
      return;
    }

    const delFolder = e.target.closest('[data-del-folder]');
    if(delFolder){
      const fid = delFolder.dataset.delFolder;
      const f = state.folders.find(x => x.id === fid);
      if(!f) return;
      if(!confirm(`确定删除分类「${f.name}」及其 ${f.sites.length} 个网站吗？`)) return;
      const idx = state.folders.findIndex(x => x.id === fid);
      if(idx > -1) state.folders.splice(idx, 1);
      save();
      renderSidebar();
      renderSections();
      renderDock();
      return;
    }
  }

  if(!editMode){
    const card = e.target.closest('.website-card');
    if(card && !e.target.closest('.visit-btn')){
      const url = card.dataset.url;
      if(url) openSite(url, card);
    }
  }
});

/* =========================================================
   18. 拖拽排序 + 拖到快捷区
   ========================================================= */
const sectionsEl = document.getElementById('sections');
const quickLinksEl = document.getElementById('quickLinks');

sectionsEl.addEventListener('dragstart', e => {
  if(!editMode) return;
  const card = e.target.closest('.website-card.editing');
  if(!card) return;
  dragSrc = { fid: card.dataset.fid, idx: +card.dataset.i };
  card.classList.add('dragging');
  try{
    e.dataTransfer.effectAllowed = 'copyMove';
    e.dataTransfer.setData('text/plain', dragSrc.fid + ':' + dragSrc.idx);
  }catch(err){}
});

sectionsEl.addEventListener('dragend', e => {
  if(dragSrc){
    const c = sectionsEl.querySelector('.website-card.editing.dragging');
    if(c) c.classList.remove('dragging');
  }
  sectionsEl.querySelectorAll('.insert-before, .insert-after').forEach(el => {
    el.classList.remove('insert-before', 'insert-after');
  });
  sectionsEl.querySelectorAll('.websites-grid.drop-end').forEach(el => {
    el.classList.remove('drop-end');
  });
  quickLinksEl.classList.remove('drop-target');
  dragSrc = null;
});

sectionsEl.addEventListener('dragover', e => {
  if(!editMode || !dragSrc) return;
  const grid = e.target.closest('.websites-grid');
  if(!grid) return;
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';

  sectionsEl.querySelectorAll('.insert-before, .insert-after').forEach(el => {
    el.classList.remove('insert-before', 'insert-after');
  });
  sectionsEl.querySelectorAll('.websites-grid.drop-end').forEach(el => {
    el.classList.remove('drop-end');
  });

  const card = e.target.closest('.website-card.editing');
  if(card && card !== sectionsEl.querySelector('.website-card.editing.dragging')){
    const rect = card.getBoundingClientRect();
    const mid = rect.left + rect.width / 2;
    const after = e.clientX > mid;
    card.classList.add(after ? 'insert-after' : 'insert-before');
  }else if(!card){
    grid.classList.add('drop-end');
  }
});

sectionsEl.addEventListener('dragleave', e => {
  const grid = e.target.closest('.websites-grid');
  if(grid && !grid.contains(e.relatedTarget)){
    grid.classList.remove('drop-end');
  }
});

sectionsEl.addEventListener('drop', e => {
  if(!editMode || !dragSrc) return;
  const grid = e.target.closest('.websites-grid');
  if(!grid) return;
  e.preventDefault();

  const dstFid = grid.dataset.fid;
  const dstF = state.folders.find(f => f.id === dstFid);
  const srcF = state.folders.find(f => f.id === dragSrc.fid);
  if(!srcF || !dstF) return;

  let insertAt;
  const card = e.target.closest('.website-card.editing');
  if(card && card !== sectionsEl.querySelector('.website-card.editing.dragging')){
    const rect = card.getBoundingClientRect();
    const mid = rect.left + rect.width / 2;
    const after = e.clientX > mid;
    insertAt = +card.dataset.i + (after ? 1 : 0);
  }else{
    insertAt = dstF.sites.length;
  }

  const [site] = srcF.sites.splice(dragSrc.idx, 1);
  if(srcF.id === dstF.id && dragSrc.idx < insertAt) insertAt--;
  dstF.sites.splice(insertAt, 0, site);

  save();
  renderSidebar();
  renderSections();
  renderDock();

  sectionsEl.querySelectorAll('.insert-before, .insert-after').forEach(el => {
    el.classList.remove('insert-before', 'insert-after');
  });
  sectionsEl.querySelectorAll('.websites-grid.drop-end').forEach(el => {
    el.classList.remove('drop-end');
  });
  dragSrc = null;
});

quickLinksEl.addEventListener('drop', e => {

/* =========================================================
   19. 编辑态输入
   ========================================================= */
sectionsEl.addEventListener('input', e => {
  if(!editMode) return;
  const t = e.target;

  if(t.classList.contains('cat-title-input')){
    const fid = t.dataset.fid;
    const f = state.folders.find(x => x.id === fid);
    if(!f) return;
    f.name = t.value || '未命名';
    save();
    renderSidebar();
    return;
  }

  if(t.classList.contains('e-n')){
    const fid = t.dataset.fid;
    const i = +t.dataset.i;
    const f = state.folders.find(x => x.id === fid);
    if(!f || !f.sites[i]) return;
    f.sites[i].n = t.value;
    const ico = t.closest('.website-card.editing').querySelector('.website-icon');
    if(ico) ico.textContent = first(t.value);
    save();
    return;
  }

  if(t.classList.contains('e-u')){
    const fid = t.dataset.fid;
    const i = +t.dataset.i;
    const f = state.folders.find(x => x.id === fid);
    if(!f || !f.sites[i]) return;
    f.sites[i].u = t.value;
    save();
  }
});

/* =========================================================
   23. 背景主题
   ========================================================= */
const themePop  = document.getElementById('themePop');
const themeList = document.getElementById('themeList');

themeList.innerHTML = Object.entries(THEMES).map(([id, t]) =>
  `<button class="theme-item" data-id="${id}">
    <span class="theme-swatch" style="background:${t.swatch}"></span>
    <span>${t.name}</span>
    <span class="theme-check">✓</span>
  </button>`
).join('');

function applyTheme(id){
  const t = THEMES[id] || THEMES.cloud;
  document.body.dataset.theme = id;
  state.theme = id;
  themeList.querySelectorAll('.theme-item').forEach(b =>
    b.classList.toggle('on', b.dataset.id === id));
}

themeList.addEventListener('click', e => {
  const btn = e.target.closest('.theme-item');
  if(!btn) return;
  applyTheme(btn.dataset.id);
  save();
  themePop.classList.remove('open');
});

document.getElementById('btnTheme').addEventListener('click', e => {
  e.stopPropagation();
  themePop.classList.toggle('open');
});
themePop.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => themePop.classList.remove('open'));

document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== document.getElementById('baiduInput')){
    e.preventDefault();
    document.getElementById('baiduInput').focus();
  }
  if(e.key === 'Escape'){
    if(document.activeElement === document.getElementById('baiduInput')){
      document.getElementById('baiduInput').blur();
    }
    themePop.classList.remove('open');
  }
});

/* =========================================================
   24. 滚动跟随高亮
   ========================================================= */
const websitesContainer = document.getElementById('websites-container');

function updateNavByScroll(){
  if(Date.now() < navLockUntil) return;
  const sections = [...document.querySelectorAll('.category-section')];
  if(!sections.length) return;

  /* 顶部 → 全部 */
  if(websitesContainer.scrollTop < 20){
    setActiveNav('all');
    return;
  }
  /* 底部 → 最后一个 */
  if(websitesContainer.scrollTop + websitesContainer.clientHeight >= websitesContainer.scrollHeight - 8){
    setActiveNav(sections[sections.length - 1].dataset.id);
    return;
  }

  /* 找到当前应该高亮的 section */
  const containerTop = websitesContainer.getBoundingClientRect().top;
  const offset = 60;
  let current = sections[0].dataset.id;
  for(const sec of sections){
    const rect = sec.getBoundingClientRect();
    if(rect.top - containerTop <= offset){
      current = sec.dataset.id;
    }else{
      break;
    }
  }
  setActiveNav(current);
}

/* =========================================================
   25. 滚动事件（高亮 + 回到顶部）
   ========================================================= */
const backTop = document.getElementById('backTop');
let scrollRaf = null;

websitesContainer.addEventListener('scroll', () => {
  if(scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = null;
    updateNavByScroll();
    backTop.classList.toggle('show', websitesContainer.scrollTop > 280);
  });
}, { passive:true });

backTop.addEventListener('click', () => {
  navLockUntil = Date.now() + 700;
  websitesContainer.scrollTo({ top:0, behavior:'smooth' });
  setActiveNav('all');
});

/* =========================================================
   26. Dock 点击（带弹动效）
   ========================================================= */
document.getElementById('dockItems').addEventListener('click', e => {
  const item = e.target.closest('.dock-item');
  if(!item) return;
  e.preventDefault();
  const url = item.dataset.url;
  if(!url) return;

  item.classList.remove('bouncing');
  void item.offsetWidth;
  item.classList.add('bouncing');
  setTimeout(() => item.classList.remove('bouncing'), 450);

  openSite(url, null);
});

/* =========================================================
   27. 导入 / 导出
   ========================================================= */
document.getElementById('btnExport').addEventListener('click', () => {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type:'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  a.href = url;
  a.download = `橘子导航-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
});

const fileInput = document.getElementById('fileInput');
document.getElementById('btnImport').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const d = JSON.parse(ev.target.result);
      if(!d || !Array.isArray(d.folders) || !d.folders.length)
        throw new Error('文件格式不正确');
      d.folders.forEach(f => {
        if(!f.id) f.id = uid();
        if(!f.key) f.key = f.id;
        if(!f.icon) f.icon = 'fas fa-folder';
        if(!Array.isArray(f.sites)) f.sites = [];
        f.sites.forEach(s => {
          if(typeof s.n !== 'string') s.n = '未命名';
          if(typeof s.u !== 'string') s.u = '';
        });
        if(typeof f.name !== 'string' || !f.name) f.name = '未命名';
      });
      state = {
        theme: (d.theme && THEMES[d.theme]) ? d.theme : 'cloud',
        folders: d.folders
      };
      applyTheme(state.theme);
      save();
      currentFilter = 'all';
      renderSidebar();
      renderSections();
      renderDock();
      alert('导入成功！');
    }catch(err){
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
