<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>橘子导航</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
  background:var(--bg-page);
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  color:var(--text-1);
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease;
}
[hidden]{display:none!important}

:root{
  --primary:#1677FF;
  --primary-hover:#4096FF;
  --primary-active:#0958D9;
  --primary-bg:#E6F4FF;
  --primary-bg-hover:#BAE0FF;

  --bg-page:#F2F3F5;
  --bg-container:#FFFFFF;
  --bg-elevated:#FFFFFF;
  --bg-hover:#F2F3F5;
  --bg-fill:#F7F8FA;

  --border:#E5E6EB;
  --border-strong:#C9CDD4;

  --text-1:#1D2129;
  --text-2:#4E5969;
  --text-3:#86909C;
  --text-4:#C9CDD4;

  --success:#00B42A;
  --success-bg:#E8FFEA;
  --warning:#FF7D00;
  --warning-bg:#FFF7E8;
  --danger:#F53F3F;
  --danger-bg:#FFECE8;

  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-xl:12px;

  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 10px rgba(0,0,0,.06);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}

body[data-theme="blue"]{--bg-page:#F0F5FF}
body[data-theme="default"]{--bg-page:#F5F7FA}
body[data-theme="gray"]{--bg-page:#F2F3F5}

body[data-mode="dark"]{
  --primary:#3C88FF;
  --primary-hover:#5C9DFF;
  --primary-active:#2E74E6;
  --primary-bg:rgba(60,136,255,.15);
  --primary-bg-hover:rgba(60,136,255,.25);

  --bg-page:#17171A;
  --bg-container:#232324;
  --bg-elevated:#2A2A2D;
  --bg-hover:#2E2E32;
  --bg-fill:#1C1C1F;

  --border:#333335;
  --border-strong:#4E4E52;

  --text-1:#F7F8FA;
  --text-2:#A9AEB8;
  --text-3:#6B6E76;
  --text-4:#4E4E52;

  --success:#23C343;
  --success-bg:rgba(35,195,67,.15);
  --warning:#FF9A2E;
  --warning-bg:rgba(255,154,46,.15);
  --danger:#F76560;
  --danger-bg:rgba(247,101,96,.15);

  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 10px rgba(0,0,0,.4);
  --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}

.app{
  width:100%;
  max-width:1800px;
  height:calc(100vh - 32px);
  background:var(--bg-container);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}

/* ===== TOPBAR 蓝色渐变 ===== */
.topbar{
  height:64px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 24px;
  background:linear-gradient(180deg,#1266e3 0%,#0A57C7 55%,#0949b0 100%);
  border-bottom:1px solid rgba(0,0,0,.12);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);
  position:relative;
  z-index:20;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
  min-width:0;
}
.logo{
  width:32px;height:32px;
  background:linear-gradient(135deg,#FFB84D,#FF8A3D);
  border-radius:var(--radius-lg);
  display:grid;
  place-items:center;
  font-size:16px;
  color:#fff;
  flex:0 0 auto;
  box-shadow:0 2px 6px rgba(255,140,60,.35);
}
.brand-name{
  font-size:16px;
  font-weight:600;
  color:#fff;
  letter-spacing:.2px;
  white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.1);
}
.top-divider{
  width:1px;
  height:20px;
  background:rgba(255,255,255,.22);
  flex:0 0 auto;
}

.quick-links{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
  position:relative;
  padding:2px;
  border-radius:var(--radius);
  transition:background .15s;
}
.quick-links.drop-target{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.quick-item{
  height:28px;
  padding:0 10px;
  border-radius:var(--radius);
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  font-size:12.5px;
  font-weight:500;
  text-decoration:none;
  position:relative;
  transition:all .15s ease;
  white-space:nowrap;
  font-family:inherit;
}
.quick-item:hover{background:rgba(255,255,255,.28);color:#fff;border-color:rgba(255,255,255,.38)}
.quick-item .quick-del{
  position:absolute;
  top:-6px;right:-6px;
  width:16px;height:16px;
  border-radius:50%;
  background:var(--danger);
  color:#fff;
  border:2px solid #0d61dc;
  font-size:9px;
  line-height:1;
  font-weight:700;
  display:grid;
  place-items:center;
  cursor:pointer;
  font-family:inherit;
  z-index:2;
}
.quick-add-hint{
  font-size:11.5px;
  color:rgba(255,255,255,.55);
  padding-left:6px;
  white-space:nowrap;
}

.search{
  flex:1 1 auto;
  max-width:400px;
  position:relative;
  display:flex;
  align-items:center;
  margin:0 4px;
}
.search input{
  width:100%;
  height:36px;
  background:rgba(255,255,255,.95);
  border:1px solid transparent;
  border-radius:var(--radius-lg);
  padding:0 92px 0 38px;
  font-family:inherit;
  font-size:13.5px;
  color:var(--text-1);
  outline:none;
  transition:all .15s;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.04);
}
.search input::placeholder{color:var(--text-3)}
.search input:hover{background:#fff}
.search input:focus{background:#fff;border-color:transparent;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.search .search-ico{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  color:var(--text-3);
  pointer-events:none;
}
.search button{
  position:absolute;
  right:3px;
  top:50%;
  transform:translateY(-50%);
  height:30px;
  padding:0 16px;
  border:none;
  border-radius:var(--radius);
  background:var(--primary);
  color:#fff;
  font-family:inherit;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  transition:all .15s;
  box-shadow:0 1px 3px rgba(22,119,255,.3);
}
.search button:hover{background:var(--primary-hover);box-shadow:0 2px 6px rgba(22,119,255,.35)}
.search button:active{background:var(--primary-active)}

.stats-inline{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:rgba(255,255,255,.8);
  white-space:nowrap;
  margin-left:auto;
}
.stats-inline b{color:#fff;font-weight:600;font-size:12.5px}
.stats-inline .dot{color:rgba(255,255,255,.35);margin:0 2px}
.clock-inline{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  color:rgba(255,255,255,.88);
  font-variant-numeric:tabular-nums;
  letter-spacing:.3px;
}
.clock-inline i{font-size:11px;color:rgba(255,255,255,.65)}

.header-tools{
  display:flex;
  align-items:center;
  gap:4px;
  flex:0 0 auto;
  position:relative;
}
.htool{
  width:34px;height:34px;
  border-radius:var(--radius);
  display:grid;
  place-items:center;
  cursor:pointer;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  font-family:inherit;
  font-size:14px;
  transition:all .15s ease;
  text-decoration:none;
}
.htool:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.34);color:#fff}
.htool.on{background:#fff;color:var(--primary);border-color:#fff}
.htool:disabled{opacity:.4;cursor:not-allowed}

.dropdown{
  position:absolute;
  top:calc(100% + 8px);
  right:0;
  min-width:170px;
  padding:6px;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  opacity:0;
  pointer-events:none;
  transform:translateY(-4px);
  transition:.15s ease;
  transform-origin:top right;
  z-index:999;
}
.dropdown.open{opacity:1;pointer-events:auto;transform:none}
.dropdown button{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border-radius:var(--radius);
  background:transparent;
  border:none;
  cursor:pointer;
  color:var(--text-1);
  font-family:inherit;
  font-size:13px;
  font-weight:400;
  text-align:left;
  transition:background .12s;
}
.dropdown button:hover{background:var(--bg-hover);color:var(--primary)}
.dropdown button i{width:14px;font-size:12px;color:var(--text-3);text-align:center}
.dropdown button:hover i{color:var(--primary)}

/* ===== BODY ===== */
.body{
  flex:1;
  display:flex;
  overflow:hidden;
  background:var(--bg-page);
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:236px;
  flex:0 0 236px;
  background:var(--bg-container);
  border-right:1px solid var(--border);
  padding:16px 12px;
  overflow-y:auto;
  scrollbar-width:none;
  position:relative;
}
.sidebar::-webkit-scrollbar{display:none}

.date-display{
  background:linear-gradient(135deg,#E6F4FF,#F0F7FF);
  padding:11px 14px;
  border-radius:var(--radius-lg);
  margin-bottom:14px;
  color:var(--primary-active);
  font-weight:500;
  font-size:12.5px;
  border:1px solid #D6E8FF;
  display:flex;
  align-items:center;
  gap:8px;
}
.date-display i{font-size:13px;color:var(--primary)}
body[data-mode="dark"] .date-display{
  background:linear-gradient(135deg,rgba(60,136,255,.15),rgba(60,136,255,.08));
  border-color:rgba(60,136,255,.25);
  color:#5C9DFF;
}
body[data-mode="dark"] .date-display i{color:#5C9DFF}

.category-list{list-style:none}
.category-item{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.category-item + .category-item{border-top:1px solid var(--border);padding-top:2px}
.category-link{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 11px;
  border-radius:var(--radius);
  color:var(--text-2);
  font-size:13px;
  font-weight:400;
  cursor:pointer;
  text-decoration:none;
  transition:all .14s ease;
  border:1px solid transparent;
}
.category-link:hover{background:var(--bg-hover);color:var(--text-1)}
.category-link.active{background:var(--primary);color:#fff;font-weight:500;box-shadow:0 2px 6px rgba(22,119,255,.2)}
.category-link.active i{color:#fff}
.category-link i{
  width:14px;
  font-size:12px;
  color:var(--text-3);
  text-align:center;
  flex:0 0 14px;
  transition:color .14s;
}
.category-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category-count{
  font-size:11px;
  color:var(--text-3);
  font-weight:500;
  flex:0 0 auto;
  padding:0 6px;
  height:18px;
  line-height:18px;
  border-radius:9px;
  background:var(--bg-fill);
  font-variant-numeric:tabular-nums;
  transition:all .14s;
}
.category-link.active .category-count{
  background:rgba(255,255,255,.22);
  color:#fff;
}

.nav-movers{display:flex;flex-direction:column;gap:1px;flex:0 0 auto}
.nav-move{
  width:20px;height:15px;
  border-radius:3px;
  display:grid;
  place-items:center;
  background:var(--bg-fill);
  border:1px solid var(--border);
  color:var(--text-3);
  cursor:pointer;
  font-family:inherit;
  font-size:7px;
  line-height:1;
  padding:0;
  transition:.14s;
}
.nav-move:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.nav-move:disabled{opacity:.3;cursor:not-allowed}
.nav-move:disabled:hover{background:var(--bg-fill);border-color:var(--border);color:var(--text-3)}

/* ===== CONTENT ===== */
.content{
  flex:1;
  overflow-y:auto;
  padding:20px 24px 80px;
  background:var(--bg-page);
  scroll-behavior:smooth;
}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;border:2px solid var(--bg-page)}
.content::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

.category-section{margin-bottom:26px;scroll-margin-top:8px}
.category-section:last-child{margin-bottom:0}

.category-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  padding:0 2px;
}
.category-header i{
  display:grid;
  place-items:center;
  width:24px;
  height:24px;
  border-radius:var(--radius);
  background:var(--primary-bg);
  color:var(--primary);
  font-size:12px;
  flex:0 0 24px;
}
.cat-title-text{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:15px;
  font-weight:600;
  color:var(--text-1);
  letter-spacing:.2px;
}
.section-count{
  font-size:12px;
  color:var(--text-3);
  font-weight:400;
  flex:0 0 auto;
  padding:0 8px;
  height:20px;
  line-height:20px;
  border-radius:10px;
  background:var(--bg-fill);
  font-variant-numeric:tabular-nums;
}

.cat-title-input{
  flex:1;
  min-width:0;
  font-size:14px;
  font-weight:600;
  color:var(--text-1);
  background:var(--bg-fill);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:4px 10px;
  outline:none;
  font-family:inherit;
  transition:all .14s;
}
.cat-title-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,119,255,.08);background:var(--bg-container)}
.cat-tools{display:flex;gap:4px;flex:0 0 auto}
.cat-mini-btn{
  width:24px;height:24px;
  border-radius:var(--radius);
  display:grid;
  place-items:center;
  cursor:pointer;
  background:var(--bg-fill);
  border:1px solid var(--border);
  color:var(--text-2);
  font-family:inherit;
  font-size:12px;
  transition:.14s;
}
.cat-mini-btn:hover{background:var(--primary-bg);border-color:var(--primary-bg-hover);color:var(--primary)}
.cat-mini-btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}

.websites-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  min-height:40px;
}
.websites-grid.drop-end{outline:2px dashed var(--primary);outline-offset:4px;border-radius:var(--radius-lg)}

/* ===== 卡片 ===== */
.website-card{
  background:var(--bg-container);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:68px;
  cursor:pointer;
  position:relative;
  min-width:0;
  transition:all .15s ease;
}
.website-card:hover{
  border-color:var(--primary-bg-hover);
  box-shadow:var(--shadow);
  transform:translateY(-1px);
}
.website-card.health-ok{border-color:var(--success)}
.website-card.health-fail{border-color:var(--danger)}
.website-card.health-unknown{border-color:var(--warning)}

.website-icon{
  width:40px;height:40px;
  flex:0 0 40px;
  border-radius:var(--radius-lg);
  background:var(--primary-bg);
  color:var(--primary);
  display:grid;
  place-items:center;
  font-size:15px;
  font-weight:600;
  line-height:1;
  transition:all .15s ease;
}
.website-card:hover .website-icon{
  background:var(--primary);
  color:#fff;
  box-shadow:0 2px 8px rgba(22,119,255,.3);
}

.website-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.website-name{
  font-size:14.5px;
  font-weight:700;
  color:var(--text-1);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.2px;
}
.website-url{
  font-size:11.5px;
  color:var(--text-3);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.website-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}
.visit-count{
  font-size:11px;
  color:var(--text-3);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  padding:2px 7px;
  height:22px;
  line-height:18px;
  border-radius:11px;
  background:var(--bg-fill);
  transition:all .15s;
}
.visit-count.has-visit{
  background:var(--success-bg);
  color:var(--success);
  font-weight:500;
}
.card-arrow{
  font-size:11px;
  color:var(--primary);
  opacity:0;
  transition:all .15s;
}
.website-card:hover .card-arrow{opacity:1;transform:translateX(2px)}

/* ===== EDITING ===== */
.website-card.editing{
  cursor:grab;
  background:var(--bg-fill);
  border-color:var(--border-strong);
  gap:10px;
  padding:10px 12px;
  min-height:64px;
}
.website-card.editing:hover{
  transform:none;
  box-shadow:none;
  border-color:var(--primary);
}
.website-card.editing:active{cursor:grabbing}
.website-card.editing.dragging{opacity:.4}
.website-card.editing.insert-before{box-shadow:-3px 0 0 var(--primary)}
.website-card.editing.insert-after{box-shadow:3px 0 0 var(--primary)}
.website-card.editing .website-icon{
  width:32px;height:32px;
  flex:0 0 32px;
  font-size:12.5px;
  pointer-events:none;
  background:var(--primary-bg);
  color:var(--primary);
}
.edit-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.edit-fields input{
  font-size:12.5px;
  color:var(--text-1);
  background:var(--bg-container);
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  padding:4px 8px;
  outline:none;
  font-family:inherit;
  min-width:0;
  transition:border-color .14s;
}
.edit-fields input::placeholder{color:var(--text-4)}
.edit-fields input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,119,255,.08)}
.edit-fields .e-n{font-weight:600}
.edit-fields .e-u{font-size:11px;color:var(--text-2)}
.card-move-btns{display:none;flex-direction:column;gap:2px;flex:0 0 auto}
.card-move-btn{
  width:20px;height:16px;
  border-radius:3px;
  display:grid;
  place-items:center;
  background:var(--bg-container);
  border:1px solid var(--border);
  color:var(--text-3);
  cursor:pointer;
  font-family:inherit;
  font-size:8px;
  line-height:1;
  padding:0;
  transition:.14s;
}
.card-move-btn:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.card-move-btn:disabled{opacity:.3;cursor:not-allowed}
.card-move-btn:disabled:hover{background:var(--bg-container);border-color:var(--border);color:var(--text-3)}
.e-del{
  width:26px;height:26px;
  flex:0 0 26px;
  border-radius:var(--radius);
  display:grid;
  place-items:center;
  cursor:pointer;
  background:var(--danger-bg);
  border:1px solid transparent;
  color:var(--danger);
  font-family:inherit;
  font-size:13px;
  transition:.14s;
}
.e-del:hover{background:var(--danger);color:#fff}

.add-card{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:68px;
  border:1.5px dashed var(--border-strong);
  border-radius:var(--radius-lg);
  background:transparent;
  color:var(--text-3);
  font-family:inherit;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  transition:all .15s;
}
.add-card:hover{
  border-color:var(--primary);
  color:var(--primary);
  background:var(--primary-bg);
}

.no-results{

body[data-density="compact"] .website-card{min-height:56px;padding:9px 12px;gap:10px;border-radius:var(--radius)}

/* ===== DOCK ===== */
.dock{
  height:60px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 24px;
  background:var(--bg-container);
  border-top:1px solid var(--border);
  position:relative;
  z-index:10;
}
.dock-label{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:500;
  color:var(--text-2);
  white-space:nowrap;
  padding-right:14px;
  border-right:1px solid var(--border);
}
.dock-label i{font-size:11px;color:var(--text-3)}
.dock-label .dock-mini-btn{
  width:22px;height:22px;
  border-radius:var(--radius-sm);
  display:grid;
  place-items:center;
  cursor:pointer;
  background:transparent;
  border:none;
  color:var(--text-3);
  font-family:inherit;
  font-size:10px;
  transition:.15s;
  padding:0;
}
.dock-label .dock-mini-btn:hover{background:var(--bg-hover);color:var(--danger)}

.dock-items{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  align-items:center;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:4px 0;
}
.dock-items::-webkit-scrollbar{display:none}
.dock-empty{font-size:12px;color:var(--text-4)}
.dock-item{
  flex:0 0 auto;
  height:32px;
  padding:0 10px;
  border-radius:var(--radius);
  background:var(--bg-fill);
  border:1px solid transparent;
  color:var(--text-2);
  font-size:12px;
  font-weight:500;
  text-decoration:none;
  cursor:pointer;
  white-space:nowrap;
  transition:all .14s;
  display:inline-flex;
  align-items:center;
  font-family:inherit;
}
.dock-item:hover{background:var(--primary-bg);color:var(--primary);border-color:var(--primary-bg-hover)}
.dock-item.bouncing{animation:dock-bounce .4s ease}
@keyframes dock-bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}

.dock-extra{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:14px;
  padding-left:14px;
  border-left:1px solid var(--border);
  height:32px;
  user-select:none;
}
.year-block{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  color:var(--text-3);
  white-space:nowrap;
  cursor:default;
}
.year-label{font-weight:500}
.year-bar{
  width:60px;height:4px;
  border-radius:2px;
  background:var(--border);
  overflow:hidden;
  position:relative;
}
.year-fill{
  position:absolute;
  left:0;top:0;bottom:0;
  width:0;
  background:var(--primary);
  border-radius:2px;
  transition:width .5s ease;
}
.year-pct{
  color:var(--primary);
  font-weight:600;
  font-variant-numeric:tabular-nums;
  font-size:11px;
  min-width:30px;
  text-align:right;
}

.work-block{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11.5px;
  color:var(--text-2);
  font-weight:500;
  white-space:nowrap;
  cursor:pointer;
  padding:4px 10px;
  border-radius:var(--radius);
  transition:all .15s;
  border:1px solid transparent;
}
.work-block:hover{background:var(--bg-hover);border-color:var(--border)}
.work-block i{font-size:11px;color:var(--text-3)}
.work-block b{color:var(--primary);font-weight:600;font-variant-numeric:tabular-nums;font-size:12px}
.work-block .worktime{color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}
.work-block .work-dot{opacity:.4}
body[data-mode="dark"] .work-block b{color:var(--primary-hover)}
.work-block.before i,.work-block.before b{color:var(--text-3)}
.work-block.done i,.work-block.done b{color:var(--success)}
.work-block.weekend i,.work-block.weekend b{color:var(--warning)}

/* ===== BACK TOP ===== */
.back-top{
  position:fixed;
  right:28px;bottom:80px;
  z-index:80;
  width:40px;height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
  cursor:pointer;
  background:var(--bg-elevated);
  color:var(--text-2);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  opacity:0;
  pointer-events:none;
  transform:translateY(8px);
  transition:.2s ease;
  font-family:inherit;
  font-size:14px;
}
.back-top.show{opacity:1;pointer-events:auto;transform:none}
.back-top:hover{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(22,119,255,.3)}

/* ===== HEALTH PANEL ===== */
.health-panel{

.health-head{

}

.health-summary{

.health-summary .fail-count{color:var(--danger)}

.health-body{flex:1;overflow-y:auto;padding:14px 20px 20px}
.health-group{margin-bottom:16px}
.health-group-title{
  font-size:11px;
  font-weight:600;
  color:var(--text-3);
  letter-spacing:.5px;
  margin-bottom:8px;
  text-transform:uppercase;
}
.health-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 11px;
  border-radius:var(--radius);
  background:var(--bg-fill);
  border:1px solid var(--border);

}
.health-item:hover{background:var(--bg-hover)}
.health-item .h-icon{
  width:22px;height:22px;
  flex:0 0 22px;
  border-radius:var(--radius-sm);
  display:grid;
  place-items:center;
  font-size:10px;
  font-weight:700;
  color:#fff;
}
.health-item .h-info{flex:1;min-width:0}
.health-item .h-name{
  font-weight:500;
  color:var(--text-1);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12.5px;
}
.health-item .h-url{

.health-item .h-del{

.health-tip{

.theme-pop{
  position:fixed;

::-webkit-scrollbar{width:8px;height:8px}

function migrateNational(d){

    if(!hasZb) gov.sites.push({ n:ZHAOBIAO_NAME, u:ZHAOBIAO_URL });

      const z = gov.sites.find(s => s.u === ZHAOBIAO_URL);
      gov.sites = gov.sites.filter(s => s.u !== ZHAOBIAO_URL);
      gov.sites.push(z);
    }
  }
  return d;
}

function buildDefault(){

function load(){
  let raw = null;
  try{
    raw = localStorage.getItem(KEY);
    if(!raw){
      for(const k of OLD_KEYS){
        const v = localStorage.getItem(k);
        if(v){ raw = v; break; }
      }
    }
  }catch(e){}
  if(raw){
    try{
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.folders) && d.folders.length){
        d.folders.forEach(f => {
          if(!f.id) f.id = uid();
          if(!f.key) f.key = f.id;
          if(!f.icon) f.icon = 'fas fa-folder';
          if(!Array.isArray(f.sites)) f.sites = [];
        });
        if(!d.theme || !THEMES[d.theme]) d.theme = 'blue';
        migrateNational(d);
        migrateV39(d);
        migrateV43(d);
        try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
        return d;
      }
    }catch(e){}
  }
  return buildDefault();
}

function loadQuick(){
  let arr = null;
  try{
    const raw = localStorage.getItem(QUICK_KEY);
    if(raw){ const o = JSON.parse(raw); if(Array.isArray(o)) arr = o; }
  }catch(e){}
  if(!arr){
    for(const k of OLD_QUICK_KEYS){
      try{
        const rawOld = localStorage.getItem(k);
        if(rawOld){ const o = JSON.parse(rawOld); if(Array.isArray(o) && o.length){ arr = o; break; } }
      }catch(e){}
    }
  }
  if(!arr) arr = DEFAULT_QUICK.map(q => ({ ...q }));

  const filtered = [];
  arr.forEach(q => {
    if(!q || !q.u) return;
    if(LOCAL_GOV_URLS.indexOf(q.u) !== -1) return;
    if(QUICK_BLOCK.some(k => q.u.indexOf(k) !== -1)) return;
    if(/bilibili\.com/.test(q.u)){ filtered.push({ n:SOUSUO_NAME, u:SOUSUO_URL }); return; }
    filtered.push({ n:q.n, u:q.u });
  });
  /* 招采统一处理：不加 hot，与其他快捷项一致 */
  const finalArr = filtered.filter(q => !QUICK_BLOCK.some(k => q.u.indexOf(k) !== -1)).map(q => {
    if(q.u === ZHAOBIAO_URL) return { n:ZHAOBIAO_NAME, u:ZHAOBIAO_URL };
    return q;
  });
  if(!finalArr.some(q => q.u === ZHAOBIAO_URL)) finalArr.unshift({ n:ZHAOBIAO_NAME, u:ZHAOBIAO_URL });

  try{ localStorage.setItem(QUICK_KEY, JSON.stringify(finalArr)); }catch(e){}
  return finalArr;
}

function setRecent(arr){ try{ localStorage.setItem(RECENT_KEY, JSON.stringify(arr.slice(0,MAX_RECENT))); }catch(e){} }
function pushRecent(url){
  const s = allSites().find(x => x.u === url); if(!s) return;
  const arr = getRecent().filter(r => r.u !== url);
  arr.unshift({ u:url, n:s.n, t:Date.now() });
  setRecent(arr); renderDock();
}

  if(!confirm('确定清空最近访问记录吗？')) return;
  setRecent([]); renderDock();

function renderDock(){
  const el = document.getElementById('dockItems'); if(!el) return;
  const arr = getRecent(); const sites = allSites();
  const valid = arr.filter(r => sites.some(s => s.u === r.u)).slice(0, DOCK_SHOW);
  if(!valid.length){ el.innerHTML = '<span class="dock-empty">暂无访问记录</span>'; return; }
  el.innerHTML = valid.map(r => {
    const s = sites.find(x => x.u === r.u);
    const name = s ? s.n : r.n;
    return `<a class="dock-item" href="${esc(r.u)}" data-url="${esc(r.u)}" title="${esc(name)}">${esc(name)}</a>`;
  }).join('');
}

function getToday(){ return new Date().toDateString(); }
function getVisitedMap(){
  try{
    const raw = JSON.parse(localStorage.getItem('juzi-visited') || '{}');
    const out = {};
    for(const url in raw){ const v = raw[url]; if(typeof v === 'string') out[url] = { date:v, count:1 }; else if(v && typeof v === 'object') out[url] = { date:v.date || '', count:v.count || 0 }; }
    return out;
  }catch(e){ return {}; }
}
function setVisitedMap(m){ try{ localStorage.setItem('juzi-visited', JSON.stringify(m)); }catch(e){} }
function getTodayCount(url){ const map = getVisitedMap(); const rec = map[url]; return (rec && rec.date === getToday()) ? (rec.count || 0) : 0; }
function markVisited(url){
  const map = getVisitedMap(), today = getToday(), rec = map[url];
  if(rec && rec.date === today) rec.count = (rec.count || 0) + 1;
  else map[url] = { date:today, count:1 };
  setVisitedMap(map);
}

function updateDate(){ document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' }); }
function updateClock(){ const n = new Date(); document.getElementById('clock').textContent = `${pad2(n.getHours())}:${pad2(n.getMinutes())}`; }

function updateYearProgress(){
  const now = new Date(), y = now.getFullYear();
  const start = new Date(y,0,1).getTime(), end = new Date(y+1,0,1).getTime();
  const pct = ((now.getTime() - start) / (end - start)) * 100;
  document.getElementById('yearFill').style.width = pct.toFixed(2) + '%';
  document.getElementById('yearPct').textContent = pct.toFixed(0) + '%';
  const total = Math.round((end - start) / 86400000), passed = Math.floor((now.getTime() - start) / 86400000) + 1;
  document.getElementById('yearBlock').title = `${y} 年已过 ${passed} 天，还剩 ${total - passed} 天`;
}

function loadOffWork(){
  try{ const raw = localStorage.getItem(OFFWORK_KEY); if(raw){ const [h,m] = raw.split(':').map(Number); if(!isNaN(h) && !isNaN(m)){ offWorkHour = h; offWorkMin = m; } } }catch(e){}
  updateWorkTitle();
}
function saveOffWork(){ try{ localStorage.setItem(OFFWORK_KEY, `${offWorkHour}:${offWorkMin}`); }catch(e){} updateWorkTitle(); }
function updateWorkTitle(){ const b = document.getElementById('workBlock'); if(b) b.title = `上班 08:30 · 下班 ${pad2(offWorkHour)}:${pad2(offWorkMin)}（点击切换）`; }
function updateWork(){
  const block = document.getElementById('workBlock'), icon = document.getElementById('offworkIcon');
  const text = document.getElementById('offworkText'), timeEl = document.getElementById('worktime');
  if(!block || !icon || !text) return;
  const offStr = `${pad2(offWorkHour)}:${pad2(offWorkMin)}`;
  if(timeEl) timeEl.textContent = `08:30–${offStr}`;
  const now = new Date(), day = now.getDay();
  if(day === 0 || day === 6){
    block.classList.remove('done','before'); block.classList.add('weekend');
    icon.className = 'fas fa-mug-hot'; text.innerHTML = '<b>周末愉快</b>'; return;
  }
  block.classList.remove('weekend');
  const start = new Date(now); start.setHours(WORK_START_H, WORK_START_M, 0, 0);
  const end = new Date(now); end.setHours(offWorkHour, offWorkMin, 0, 0);
  if(now < start){
    const diff = start - now, h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
    block.classList.remove('done'); block.classList.add('before');
    icon.className = 'fas fa-coffee'; text.innerHTML = `距上班 <b>${pad2(h)}:${pad2(m)}:${pad2(s)}</b>`;
  }else if(now < end){
    const diff = end - now, h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
    block.classList.remove('done','before');
    icon.className = h > 0 ? 'fas fa-hourglass-half' : 'fas fa-hourglass-end';
    text.innerHTML = `距下班 <b>${pad2(h)}:${pad2(m)}:${pad2(s)}</b>`;
  }else{
    block.classList.add('done'); block.classList.remove('before');
    icon.className = 'fas fa-mug-hot'; text.innerHTML = '<b>已下班</b>';
  }
}
function bindWorkClick(){
  const b = document.getElementById('workBlock'); if(!b) return;
  b.addEventListener('click', () => {
    const idx = OFFWORK_OPTIONS.findIndex(([h,m]) => h === offWorkHour && m === offWorkMin);
    const next = (idx + 1) % OFFWORK_OPTIONS.length;
    [offWorkHour, offWorkMin] = OFFWORK_OPTIONS[next];
    saveOffWork(); updateWork();
  });
}

function setActiveNav(id){
  if(!id) return;
  currentFilter = id;
  document.querySelectorAll('.category-link').forEach(a => a.classList.toggle('active', a.dataset.category === id));
}

function moveFolder(fid, dir){
  const idx = state.folders.findIndex(f => f.id === fid);
  if(idx < 0) return;
  const to = idx + dir;
  if(to < 0 || to >= state.folders.length) return;
  [state.folders[idx], state.folders[to]] = [state.folders[to], state.folders[idx]];
  save(); renderSidebar(); renderSections(); renderDock();
  setTimeout(() => {
    const sec = document.querySelector(`.category-section[data-id="${fid}"]`);
    if(sec){
      const secRect = sec.getBoundingClientRect();
      const cRect = websitesContainer.getBoundingClientRect();
      const top = websitesContainer.scrollTop + (secRect.top - cRect.top) - 8;
      navLockUntil = Date.now() + 700;
      websitesContainer.scrollTo({ top, behavior:'smooth' });
    }
  }, 30);
}

function renderSidebar(){
  const list = document.getElementById('category-list');
  const total = state.folders.reduce((a,f) => a + f.sites.length, 0);
  let html = `<li class="category-item">
    <a class="category-link${currentFilter === 'all' ? ' active' : ''}" data-category="all">
      <i class="fas fa-globe"></i>
      <span class="category-name">全部网站</span>
      <span class="category-count">${total}</span>
    </a>
  </li>`;

  html += state.folders.map((f, idx) => {
    const isFirst = idx === 0;
    const isLast = idx === state.folders.length - 1;
    const movers = editMode ? `<div class="nav-movers">
      <button class="nav-move" data-fid="${f.id}" data-dir="-1" ${isFirst ? 'disabled' : ''} title="上移">▲</button>
      <button class="nav-move" data-fid="${f.id}" data-dir="1" ${isLast ? 'disabled' : ''} title="下移">▼</button>
    </div>` : '';
    return `<li class="category-item">
      <a class="category-link${currentFilter === f.id ? ' active' : ''}" data-category="${f.id}">
        <i class="${f.icon}"></i>
        <span class="category-name">${esc(f.name)}</span>
        <span class="category-count">${f.sites.length}</span>
      </a>
      ${movers}
    </li>`;
  }).join('');

  list.innerHTML = html;

  list.querySelectorAll('.category-link').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const cat = a.dataset.category;
      navLockUntil = Date.now() + 700;
      if(cat === 'all'){
        websitesContainer.scrollTo({ top:0, behavior:'smooth' });
        setActiveNav('all');
      }else{
        const sec = document.querySelector(`.category-section[data-id="${cat}"]`);
        if(sec){
          const secRect = sec.getBoundingClientRect(), cRect = websitesContainer.getBoundingClientRect();
          const top = websitesContainer.scrollTop + (secRect.top - cRect.top) - 8;
          websitesContainer.scrollTo({ top, behavior:'smooth' });
          setActiveNav(cat);
        }
      }
      closeMobileSidebar();
    });
  });

  list.querySelectorAll('.nav-move').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();

  document.getElementById('stat-total').textContent = total;

    const rect = card.getBoundingClientRect(); const after = e.clientX > rect.left + rect.width / 2;
    card.classList.add(after ? 'insert-after' : 'insert-before');

sectionsEl.addEventListener('drop', e => {
  if(!editMode || !dragSrc) return;
  const grid = e.target.closest('.websites-grid'); if(!grid) return;
  e.preventDefault();
  const dstF = state.folders.find(f => f.id === grid.dataset.fid);
  const srcF = state.folders.find(f => f.id === dragSrc.fid);
  if(!srcF || !dstF) return;
  let insertAt;
  const card = e.target.closest('.website-card.editing');
  if(card && card !== sectionsEl.querySelector('.website-card.editing.dragging')){
    const rect = card.getBoundingClientRect(); const after = e.clientX > rect.left + rect.width / 2;
    insertAt = +card.dataset.i + (after ? 1 : 0);
  }else{ insertAt = dstF.sites.length; }
  const [site] = srcF.sites.splice(dragSrc.idx, 1);
  if(srcF.id === dstF.id && dragSrc.idx < insertAt) insertAt--;
  dstF.sites.splice(insertAt, 0, site);
  save(); renderSidebar(); renderSections(); renderDock();
  sectionsEl.querySelectorAll('.insert-before, .insert-after').forEach(el => el.classList.remove('insert-before', 'insert-after'));
  sectionsEl.querySelectorAll('.websites-grid.drop-end').forEach(el => el.classList.remove('drop-end'));

const btnHealth = document.getElementById('btnHealth');
const healthPanel = document.getElementById('healthPanel');
const healthClose = document.getElementById('healthClose');
const healthBody = document.getElementById('healthBody');
const healthSummary = document.getElementById('healthSummary');
healthClose.addEventListener('click', () => healthPanel.classList.remove('open'));

btnHealth.addEventListener('click', async () => {
  if(!editMode) return;
  const sites = allSites();
  if(!confirm(`将尝试检测 ${sites.length} 个网站的可达性（可能需要 1-2 分钟）。\n\n受浏览器 CORS 限制，部分站点可能被误判为“未知”。`)) return;
  btnHealth.disabled = true;
  btnHealth.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  const results = {};
  let i = 0;
  const CONCURRENCY = 6;
  async function worker(){
    while(i < sites.length){
      const s = sites[i++];
      try{
        await fetch(s.u, { mode:'no-cors', method:'HEAD', signal: AbortSignal.timeout(6000) });
        results[s.u] = 'ok';
      }catch(err){
        if(err.name === 'TimeoutError' || err.name === 'AbortError') results[s.u] = 'unknown';
        else results[s.u] = 'fail';
      }
    }
  }
  await Promise.all(Array(CONCURRENCY).fill(0).map(worker));

  document.querySelectorAll('.website-card.editing').forEach(card => {
    const r = results[card.dataset.url];
    card.classList.remove('health-ok','health-fail','health-unknown');
    if(r === 'ok') card.classList.add('health-ok');
    else if(r === 'fail') card.classList.add('health-fail');
    else if(r === 'unknown') card.classList.add('health-unknown');
  });

  const fails = sites.filter(s => results[s.u] === 'fail');
  const unknowns = sites.filter(s => results[s.u] === 'unknown');
  const oks = sites.filter(s => results[s.u] === 'ok');

  healthSummary.innerHTML = `
    共检测 <b>${sites.length}</b> 个网站：
    <span style="color:var(--success)"><b>${oks.length}</b> 个可达</span>，
    <span class="fail-count"><b>${fails.length}</b> 个疑似失效</span>，
    <span class="unknown-count"><b>${unknowns.length}</b> 个超时/未知</span>
  `;

  let bodyHtml = '';
  if(fails.length){
    bodyHtml += `<div class="health-group">
      <div class="health-group-title" style="color:var(--danger)">疑似失效 (${fails.length})</div>
      ${fails.map(s => `
        <div class="health-item" data-url="${esc(s.u)}">
          <div class="h-icon" style="background:var(--danger)">×</div>
          <div class="h-info"><div class="h-name">${esc(s.n)}</div><div class="h-url">${esc(s.u)}</div></div>
          <button class="h-del" data-url="${esc(s.u)}" title="删除">×</button>
        </div>
      `).join('')}
    </div>`;
  }
  if(unknowns.length){
    bodyHtml += `<div class="health-group">
      <div class="health-group-title" style="color:var(--warning)">超时 / 未知 (${unknowns.length})</div>
      ${unknowns.map(s => `
        <div class="health-item" data-url="${esc(s.u)}">
          <div class="h-icon" style="background:var(--warning)">?</div>
          <div class="h-info"><div class="h-name">${esc(s.n)}</div><div class="h-url">${esc(s.u)}</div></div>
          <button class="h-del" data-url="${esc(s.u)}" title="删除">×</button>
        </div>
      `).join('')}
    </div>`;
  }
  if(!fails.length && !unknowns.length){
    bodyHtml = `<div class="health-empty"><i class="fas fa-check-circle" style="font-size:36px;color:var(--success);margin-bottom:10px;display:block"></i>太棒了，没有发现失效链接！</div>`;
  }
  healthBody.innerHTML = bodyHtml;

  healthBody.querySelectorAll('.h-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const url = btn.dataset.url;
      if(!confirm('确定要从导航中彻底删除这个网站吗？')) return;
      let found = false;
      for(const f of state.folders){
        const idx = f.sites.findIndex(s => s.u === url);
        if(idx > -1){ f.sites.splice(idx, 1); found = true; break; }
      }
      if(found){
        save(); renderSidebar(); renderSections(); renderDock();
        const item = btn.closest('.health-item');
        if(item) item.remove();
        const group = btn.closest('.health-group');
        if(group && group.querySelectorAll('.health-item').length === 0) group.remove();
        if(healthBody.querySelectorAll('.health-item').length === 0){
          healthBody.innerHTML = `<div class="health-empty"><i class="fas fa-check-circle" style="font-size:36px;color:var(--success);margin-bottom:10px;display:block"></i>太棒了，没有发现失效链接！</div>`;
        }
      }
    });
  });

  healthPanel.classList.add('open');
  btnHealth.disabled = false;
  btnHealth.innerHTML = '<i class="fas fa-heart-pulse"></i>';
});

const exportDrop = document.getElementById('exportDrop');
document.getElementById('btnExport').addEventListener('click', e => { e.stopPropagation(); exportDrop.classList.toggle('open'); });
exportDrop.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => exportDrop.classList.remove('open'));

document.getElementById('exportJson').addEventListener('click', () => {
  exportDrop.classList.remove('open');
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type:'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url; a.download = `橘子导航-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
});

const fileInput = document.getElementById('fileInput');
document.getElementById('btnImport').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const d = JSON.parse(ev.target.result);
      if(!d || !Array.isArray(d.folders) || !d.folders.length) throw new Error('文件格式不正确');
      d.folders.forEach(f => {
        if(!f.id) f.id = uid();
        if(!f.key) f.key = f.id;
        if(!f.icon) f.icon = 'fas fa-folder';
        if(!Array.isArray(f.sites)) f.sites = [];
        f.sites.forEach(s => { if(typeof s.n !== 'string') s.n = '未命名'; if(typeof s.u !== 'string') s.u = ''; });
        if(typeof f.name !== 'string' || !f.name) f.name = '未命名';
      });
      state = { theme:(d.theme && THEMES[d.theme]) ? d.theme : 'blue', folders:d.folders };
      migrateNational(state);
      migrateV39(state);
      migrateV43(state);
      applyTheme(state.theme); save(); currentFilter = 'all';
      renderSidebar(); renderSections(); renderDock();
      alert('导入成功！');
    }catch(err){ alert('导入失败：' + err.message); }
  };
  reader.readAsText(file); e.target.value = '';
});

const themePop = document.getElementById('themePop');
const themeList = document.getElementById('themeList');
themeList.innerHTML = Object.entries(THEMES).map(([id,t]) =>
  `<button class="theme-item" data-id="${id}"><span class="theme-swatch" style="background:${t.swatch}"></span><span>${t.name}</span><span class="theme-check">✓</span></button>`
).join('');
function applyTheme(id){
  if(!THEMES[id]) id = 'blue';
  document.body.dataset.theme = id; state.theme = id;
  themeList.querySelectorAll('.theme-item').forEach(b => b.classList.toggle('on', b.dataset.id === id));
}
themeList.addEventListener('click', e => {
  const btn = e.target.closest('.theme-item'); if(!btn) return;
  applyTheme(btn.dataset.id); save(); themePop.classList.remove('open');
});
document.getElementById('btnTheme').addEventListener('click', e => { e.stopPropagation(); themePop.classList.toggle('open'); });
themePop.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => themePop.classList.remove('open'));

/* 搜索框：聚焦时提示文字消失，失焦且为空时恢复 */
const baiduInput = document.getElementById('baiduInput');
baiduInput.addEventListener('focus', function(){
  this.dataset.ph = this.placeholder;
  this.placeholder = '';
});
baiduInput.addEventListener('blur', function(){
  if(!this.value && this.dataset.ph) this.placeholder = this.dataset.ph;
});

const websitesContainer = document.getElementById('websites-container');
function updateNavByScroll(){
  if(Date.now() < navLockUntil) return;
  const sections = [...document.querySelectorAll('.category-section')];
  if(!sections.length) return;
  if(websitesContainer.scrollTop < 20){ setActiveNav('all'); return; }
  if(websitesContainer.scrollTop + websitesContainer.clientHeight >= websitesContainer.scrollHeight - 8){
    setActiveNav(sections[sections.length-1].dataset.id); return;
  }
  const cTop = websitesContainer.getBoundingClientRect().top, offset = 60;
  let cur = sections[0].dataset.id;
  for(const sec of sections){ const rect = sec.getBoundingClientRect(); if(rect.top - cTop <= offset) cur = sec.dataset.id; else break; }
  setActiveNav(cur);
}
const backTop = document.getElementById('backTop');
let scrollRaf = null;
websitesContainer.addEventListener('scroll', () => {
  if(scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = null;
    updateNavByScroll();
    backTop.classList.toggle('show', websitesContainer.scrollTop > 280);
  });
}, { passive:true });
backTop.addEventListener('click', () => { navLockUntil = Date.now() + 700; websitesContainer.scrollTo({ top:0, behavior:'smooth' }); setActiveNav('all'); });

document.getElementById('dockItems').addEventListener('click', e => {
  const item = e.target.closest('.dock-item'); if(!item) return;
  e.preventDefault();
  const url = item.dataset.url; if(!url) return;
  item.classList.remove('bouncing'); void item.offsetWidth; item.classList.add('bouncing');
  setTimeout(() => item.classList.remove('bouncing'), 420);
  openSite(url, null);
});
document.getElementById('btnClearRecent').addEventListener('click', clearRecent);

document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== document.getElementById('baiduInput')){ e.preventDefault(); document.getElementById('baiduInput').focus(); }
  if(e.key === 'Escape'){
    if(document.activeElement === document.getElementById('baiduInput')) document.getElementById('baiduInput').blur();
    themePop.classList.remove('open'); exportDrop.classList.remove('open');
    healthPanel.classList.remove('open');
    closeMobileSidebar();
  }
});

(function init(){
  state = load(); quickLinks = loadQuick();
  applyTheme(state.theme); initMode(); initDensity();
  loadOffWork();
  updateDate(); updateClock(); updateYearProgress(); updateWork();
  renderQuickLinks(); renderSidebar(); renderSections(); renderDock();
  bindWorkClick();
  setActiveNav('all');
  setInterval(() => { updateDate(); updateClock(); updateYearProgress(); updateWork(); }, 1000);
})();
</script>
