<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>橘子导航</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Microsoft YaHei','PingFang SC',system-ui,sans-serif}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page-bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:var(--txt);transition:background .3s ease,color .3s ease;overflow-x:hidden}
:root{--brand:#0A57C7;--brand-dark:#0846A8;--page-bg:#f0f4f8;--surface:#fff;--surface-2:#f8faff;--surface-3:#f0f4fa;--line:#e2e8f0;--line-2:#d0dcec;--txt:#1e2f40;--txt-2:#5f6f82;--txt-3:#a0b0c0;--shadow:0 8px 20px rgba(0,0,0,.05);--shadow-h:0 4px 14px rgba(0,0,0,.07);--ico-bg:#E8F1FF;--ico-color:#0A57C7;--ico-border:#d3e4fb;--dock-sh:0 -4px 20px rgba(0,0,0,.04)}
body[data-theme="cloud"]{--page-bg:#f0f4f8;--surface:#fff;--surface-2:#f8faff;--surface-3:#f0f4fa}
body[data-theme="white"]{--page-bg:#f7f8fa;--surface:#fff;--surface-2:#fbfcfe;--surface-3:#f2f4f8}
body[data-theme="blue"]{--page-bg:#eaf1fa;--surface:#fff;--surface-2:#f5f9ff;--surface-3:#eaf2fc}
body[data-mode="dark"]{--page-bg:#0f1117;--surface:#1a1d24;--surface-2:#14171d;--surface-3:#232730;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);--txt:#e6e8ee;--txt-2:rgba(230,232,238,.55);--txt-3:rgba(230,232,238,.3);--ico-bg:rgba(30,90,200,.22);--ico-color:#7cb0ff;--ico-border:rgba(124,176,255,.22);--shadow:0 8px 20px rgba(0,0,0,.4);--shadow-h:0 4px 14px rgba(0,0,0,.5);--dock-sh:0 -4px 24px rgba(0,0,0,.45)}

.container{max-width:1800px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:95vh;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 24px;height:64px;background:var(--brand);border-bottom:1px solid rgba(255,255,255,.12);overflow-x:hidden}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:linear-gradient(145deg,#FFB84D,#FF8A3D);box-shadow:0 4px 10px rgba(255,140,60,.24),inset 0 1px 0 rgba(255,255,255,.55);flex:0 0 auto}
.brand h1{font-size:16.5px;font-weight:700;color:#fff;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-divider{width:1px;height:26px;background:rgba(255,255,255,.25);flex:0 0 auto}

.quick-links{display:flex;align-items:center;gap:6px;flex:0 0 auto;position:relative;padding:3px;border-radius:10px;transition:background .15s ease,box-shadow .15s ease}
.quick-links.drop-target{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.quick-item{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);color:#fff;font-size:12.5px;font-weight:700;text-decoration:none;position:relative;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);line-height:1}
.quick-item:hover{transform:translateY(-2px);background:rgba(255,255,255,.3);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.quick-item.hot{background:linear-gradient(145deg,#FF8A4D,#E2392B);border-color:rgba(255,255,255,.55);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.28),0 4px 12px rgba(226,58,46,.42),inset 0 1px 0 rgba(255,255,255,.45)}
.quick-item.hot:hover{background:linear-gradient(145deg,#FF9A5F,#EF4636);transform:translateY(-2px) scale(1.06);box-shadow:0 0 0 3px rgba(255,255,255,.35),0 4px 16px rgba(226,58,46,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.quick-item .quick-del{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#e05252;color:#fff;border:none;font-size:11px;line-height:1;font-weight:700;display:grid;place-items:center;cursor:pointer;font-family:inherit;box-shadow:0 2px 4px rgba(0,0,0,.2);z-index:2}
.quick-add-hint{font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;padding-left:4px;border-left:1px dashed rgba(255,255,255,.35);margin-left:4px;line-height:1.3;max-width:100px}

.baidu-search{flex:1 1 auto;max-width:340px;position:relative;display:flex;align-items:center;margin:0 4px}
.baidu-search .search-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#8a9bb0;font-size:13px;pointer-events:none}
.baidu-search input{width:100%;height:37px;border-radius:19px;border:1px solid transparent;background:rgba(255,255,255,.94);color:#1e2f40;font-size:13.5px;padding:0 80px 0 39px;outline:none;font-family:inherit;transition:background .16s ease,box-shadow .16s ease}
.baidu-search input:focus{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28)}
.baidu-search button{position:absolute;right:3px;top:50%;transform:translateY(-50%);height:29px;padding:0 15px;border-radius:15px;border:none;background:linear-gradient(180deg,#2b7ae8 0%,#0a57c7 55%,#0846a8 100%);color:#fff;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.3px;box-shadow:0 2px 0 #063a8a,0 4px 8px rgba(10,87,199,.35),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 4px rgba(0,0,0,.18);transition:transform .08s ease,box-shadow .08s ease,background .15s ease}
.baidu-search button:hover{background:linear-gradient(180deg,#3a86ee 0%,#0f5fd6 55%,#0a4fb8 100%);box-shadow:0 2px 0 #063a8a,0 5px 12px rgba(10,87,199,.42),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.18)}
.baidu-search button:active{transform:translateY(calc(-50% + 2px));box-shadow:0 1px 0 #063a8a,0 2px 4px rgba(10,87,199,.3),inset 0 2px 4px rgba(0,0,0,.25)}

.stats-inline{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.82);white-space:nowrap;margin-left:auto}
.stats-inline b{color:#fff;font-weight:700;font-size:12.5px}
.stats-inline .dot{color:rgba(255,255,255,.4)}
.clock-inline{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:rgba(255,255,255,.9);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.clock-inline i{font-size:11px;opacity:.7}

.header-tools{display:flex;align-items:center;gap:6px;flex:0 0 auto;position:relative}
.htool{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-family:inherit;font-size:14px;transition:background .15s ease,border-color .15s ease,transform .15s ease,color .15s ease}
.htool:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.36);transform:translateY(-1px)}
.htool.on{background:#fff;border-color:#fff;color:var(--brand)}
.htool:disabled{opacity:.6;cursor:not-allowed}

.dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:160px;padding:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 42px -16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transition:.15s;transform-origin:top right;z-index:90}
.dropdown.open{opacity:1;pointer-events:auto;transform:none}
.dropdown button{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:transparent;border:none;cursor:pointer;color:var(--txt);font-family:inherit;font-size:12.5px;font-weight:500;text-align:left;transition:background .13s}
.dropdown button:hover{background:var(--surface-3)}
.dropdown button i{width:14px;font-size:12px;color:var(--txt-2);text-align:center}

.main-content{display:flex;flex:1;overflow:hidden;background:var(--surface-2)}
.sidebar{width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--line);padding:14px 13px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
.sidebar::-webkit-scrollbar{display:none;width:0;height:0}
.date-display{background:var(--ico-bg);padding:9px 14px;border-radius:15px;margin-bottom:12px;color:var(--ico-color);font-weight:500;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;border:1px solid var(--ico-border)}

.category-list{list-style:none}
.category-item{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.category-link{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:22px;color:var(--txt);text-decoration:none;font-size:12.5px;font-weight:500;transition:background .15s ease,color .15s ease;background:transparent;border:1px solid transparent;cursor:pointer}
.category-link:hover{background:var(--surface-3);border-color:var(--line-2)}
.category-link.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.category-link.active i{color:#fff}
.category-link.active .category-count{background:rgba(255,255,255,.3);color:#fff;border-color:rgba(255,255,255,.3)}
.category-link i{width:16px;font-size:13px;color:var(--txt-2);text-align:center;flex:0 0 16px}
.category-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category-count{margin-left:auto;background:var(--surface-3);padding:1px 7px;border-radius:20px;font-size:10.5px;color:var(--txt-2);border:1px solid var(--line-2);flex:0 0 auto}

.nav-movers{display:flex;flex-direction:column;gap:1px;flex:0 0 auto}
.nav-move{width:20px;height:15px;border-radius:5px;display:grid;place-items:center;background:var(--surface-3);border:1px solid var(--line);color:var(--txt-3);cursor:pointer;font-family:inherit;font-size:8px;line-height:1;transition:.14s;padding:0}
.nav-move:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.nav-move:disabled{opacity:.25;cursor:not-allowed}
.nav-move:disabled:hover{background:var(--surface-3);border-color:var(--line);color:var(--txt-3)}

.websites-container{flex:1;padding:16px 22px 90px;overflow-y:auto;background:var(--surface-2);scroll-behavior:smooth}
.category-section{margin-bottom:24px;scroll-margin-top:8px}
.category-section:last-child{margin-bottom:0}

.category-header{font-size:16px;font-weight:700;margin:0 0 10px 0;padding-bottom:6px;color:var(--txt);display:flex;align-items:center;gap:9px;border-bottom:2px solid var(--line-2)}
.category-header i{background:var(--ico-bg);width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ico-color);flex:0 0 32px;border:1px solid var(--ico-border)}
.category-header .cat-title-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category-header .cat-title-input{flex:1;min-width:0;font-family:inherit;font-size:16px;font-weight:700;color:var(--txt);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:3px 10px;outline:none}
.category-header .cat-title-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,87,199,.12)}
.category-header .cat-tools{display:flex;gap:4px;flex:0 0 auto}
.cat-mini-btn{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;cursor:pointer;background:var(--surface);border:1px solid var(--line);color:var(--txt-2);font-family:inherit;font-size:13px;transition:.14s}
.cat-mini-btn:hover{background:var(--surface-3);border-color:var(--line-2);color:var(--txt)}
.cat-mini-btn.danger:hover{background:#c96b6b;border-color:#c96b6b;color:#fff}

.websites-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:40px}
.websites-grid.drop-end{outline:2px dashed var(--brand);outline-offset:4px;border-radius:10px}

.website-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:11px 14px;display:flex;align-items:center;gap:12px;min-height:72px;transition:box-shadow .18s ease,border-color .18s ease,opacity .18s ease,min-height .2s ease,padding .2s ease;cursor:default;position:relative;min-width:0}
.website-card:hover{border-color:var(--line-2);box-shadow:var(--shadow-h)}
.website-card.health-ok{border-color:#2e9e64 !important;border-width:2px}
.website-card.health-fail{border-color:#dc2626 !important;border-width:2px;background:rgba(220,38,38,.03)}
.website-card.health-unknown{border-color:#d97706 !important;border-width:2px;background:rgba(217,119,6,.03)}

.website-icon{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--ico-color);background:var(--ico-bg);border:1px solid var(--ico-border);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);line-height:1;overflow:hidden;transition:width .2s ease,height .2s ease,font-size .2s ease}
.website-info{flex:1;min-width:0}
.website-name{font-size:14px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.website-url{font-size:11px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.website-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:2px}
.visit-btn{background:var(--brand);border:1px solid var(--brand-dark);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;white-space:nowrap;flex:0 0 auto}
.visit-btn:hover{background:var(--brand-dark)}
.visit-btn i{font-size:10px}
.visit-count{display:inline-block;min-width:62px;text-align:center;font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--surface-3);color:var(--txt-2);border:1px solid var(--line-2);flex:0 0 auto}
.visit-count.has-visit{background:rgba(31,112,68,.12);color:#2e9e64;border-color:rgba(46,158,100,.28)}
body[data-mode="dark"] .visit-count.has-visit{background:rgba(46,158,100,.16);color:#5ad08e;border-color:rgba(90,208,142,.3)}

.website-card.editing{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);padding:9px 11px;min-height:68px;cursor:grab;position:relative}
.website-card.editing:hover{box-shadow:none;border-color:var(--line-2)}
.website-card.editing:active{cursor:grabbing}
.website-card.editing.dragging{opacity:.4}
.website-card.editing.insert-before{box-shadow:-3px 0 0 0 var(--brand)}
.website-card.editing.insert-after{box-shadow:3px 0 0 0 var(--brand)}
.website-card.editing .website-icon{width:34px;height:34px;flex:0 0 34px;font-size:13.5px;pointer-events:none}
.edit-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.edit-fields input{font-family:inherit;font-size:12.5px;color:var(--txt);background:var(--surface-3);border:1px solid transparent;border-radius:6px;padding:4px 8px;outline:none;min-width:0;transition:.14s;cursor:text}
.edit-fields input::placeholder{color:var(--txt-3)}
.edit-fields input:focus{background:var(--surface);border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,87,199,.1)}
.edit-fields .e-n{font-weight:600}
.edit-fields .e-u{font-size:11px;color:var(--txt-2)}
.e-del{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;cursor:pointer;background:rgba(190,110,110,.1);border:1px solid rgba(190,110,110,.2);color:#c07a7a;font-family:inherit;font-size:14px;transition:.14s}
.e-del:hover{background:#c96b6b;color:#fff;border-color:#c96b6b}

.card-move-btns{display:none;flex-direction:column;gap:2px;flex:0 0 auto}
.card-move-btn{width:22px;height:18px;border-radius:4px;display:grid;place-items:center;background:var(--surface-3);border:1px solid var(--line);color:var(--txt-3);cursor:pointer;font-family:inherit;font-size:9px;line-height:1;padding:0;transition:.14s}
.card-move-btn:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.card-move-btn:disabled{opacity:.25;cursor:not-allowed}
.card-move-btn:disabled:hover{background:var(--surface-3);border-color:var(--line);color:var(--txt-3)}

.add-card{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:15px;border:1.5px dashed var(--line-2);background:transparent;color:var(--txt-3);font-family:inherit;font-size:12.5px;font-weight:520;cursor:pointer;transition:.15s;min-height:72px}
.add-card:hover{border-color:var(--brand);color:var(--brand);background:var(--surface)}

.no-results{text-align:center;padding:70px 20px;color:var(--txt-2);font-size:15px;background:var(--surface);border-radius:20px;border:1px solid var(--line)}

body[data-density="compact"] .website-card{min-height:56px;padding:8px 12px;gap:10px;border-radius:12px}
body[data-density="compact"] .website-icon{width:36px;height:36px;flex:0 0 36px;font-size:14px}
body[data-density="compact"] .website-name{font-size:13px}
body[data-density="compact"] .website-url{font-size:10px}
body[data-density="compact"] .visit-btn{padding:5px 10px;font-size:11px;border-radius:16px}
body[data-density="compact"] .visit-count{font-size:10px;min-width:56px;padding:2px 7px}
body[data-density="compact"] .websites-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
body[data-density="compact"] .category-section{margin-bottom:18px}
body[data-density="compact"] .add-card{min-height:56px;padding:8px 12px;border-radius:12px}

.dock{flex:0 0 auto;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--dock-sh);position:relative;z-index:10}
.dock-label{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--txt-2);white-space:nowrap;padding-right:14px;border-right:1px solid var(--line)}
.dock-label i{font-size:11px;opacity:.7}
.dock-label .dock-mini-btn{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;cursor:pointer;background:transparent;border:1px solid transparent;color:var(--txt-3);font-family:inherit;font-size:10px;transition:.15s;padding:0}
.dock-label .dock-mini-btn:hover{background:var(--surface-3);border-color:var(--line-2);color:var(--txt-2)}

.dock-items{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.dock-items::-webkit-scrollbar{display:none}
.dock-item{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ico-bg);border:1px solid var(--ico-border);color:var(--ico-color);font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;position:relative;transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);line-height:1}
.dock-item:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 8px 16px rgba(10,87,199,.24),inset 0 1px 0 rgba(255,255,255,.28)}
@keyframes dock-bounce{0%{transform:translateY(-4px) scale(1.05)}35%{transform:translateY(-10px) scale(1.18)}65%{transform:translateY(-6px) scale(1.1)}100%{transform:translateY(-4px) scale(1.05)}}
.dock-item.bouncing{animation:dock-bounce .4s cubic-bezier(.34,1.56,.64,1)}
.dock-empty{font-size:12px;color:var(--txt-3);padding-left:4px}

.dock-extra{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding-left:14px;margin-left:2px;border-left:1px solid var(--line);height:34px;user-select:none}
.year-block{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt-2);font-weight:500;white-space:nowrap;cursor:default}
.year-label{font-weight:600;opacity:.85}
.year-bar{width:70px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.year-fill{position:absolute;top:0;left:0;bottom:0;width:0%;background:linear-gradient(90deg,#2C7AE6,#0A57C7);border-radius:3px;transition:width .6s ease}
.year-pct{color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums;font-size:11px;min-width:32px;text-align:right}
body[data-mode="dark"] .year-pct{color:var(--ico-color)}
.dock-sep{width:1px;height:22px;background:var(--line);flex:0 0 auto}

.work-block{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt-2);font-weight:500;white-space:nowrap;cursor:pointer;padding:5px 10px;border-radius:16px;transition:background .15s ease;border:1px solid transparent}
.work-block:hover{background:var(--surface-3);border-color:var(--line-2)}
.work-block i{font-size:11px;color:var(--brand)}
.work-block b{color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.3px}
.work-block .worktime{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.work-block .work-dot{opacity:.35;margin:0 1px}

function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function first(str){ const c = (str || '?').trim()[0] || '?'; return /[a-zA-Z]/.test(c) ? c.toUpperCase() : c; }
function domain(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u || ''; } }
function allSites(){ return state.folders.flatMap(f => f.sites); }
function pad2(n){ return String(n).padStart(2,'0'); }

}

function buildDefault(){
  return { theme:'cloud', folders: DEFAULT_FOLDERS.map(f => ({ id:uid(), key:f.key, name:f.name, icon:f.icon, sites:f.sites.map(s => ({ n:s.n, u:s.u })) })) };
}
function migrateState(d){
  if(!d || !Array.isArray(d.folders)) return d;
  const gov = d.folders.find(f => f.key === 'gov' || f.name === '政务采购');
  if(gov && Array.isArray(gov.sites)){
    gov.sites = gov.sites.filter(s => GOV_DROP_URLS.indexOf(s.u) === -1);
    if(!gov.sites.some(s => s.u === ZHAOBIAO_URL)){
      gov.sites.push({ n:ZHAOBIAO_NAME, u:ZHAOBIAO_URL });
    }
  }
  return d;
}
function load(){
  try{
    let raw = localStorage.getItem(KEY), fromOld = false;
    if(!raw){ raw = localStorage.getItem(OLD_KEY); fromOld = !!raw; }
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.folders) && d.folders.length){
        d.folders.forEach(f => {
          if(!f.id) f.id = uid();
          if(!f.key) f.key = f.id;
          if(!f.icon) f.icon = 'fas fa-folder';
          if(!Array.isArray(f.sites)) f.sites = [];
        });
        if(!d.theme || !THEMES[d.theme]) d.theme = 'cloud';
        migrateState(d);
        if(fromOld){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
        return d;
      }
    }
  }catch(e){}
  return buildDefault();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function getRecent(){ try{ const raw = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); return Array.isArray(raw) ? raw : []; }catch(e){ return []; } }
function setRecent(arr){ try{ localStorage.setItem(RECENT_KEY, JSON.stringify(arr.slice(0,MAX_RECENT))); }catch(e){} }
function pushRecent(url){
  const s = allSites().find(x => x.u === url); if(!s) return;
  const arr = getRecent().filter(r => r.u !== url);
  arr.unshift({ u:url, n:s.n, t:Date.now() });
  setRecent(arr); renderDock();
}

function renderDock(){
  const el = document.getElementById('dockItems'); if(!el) return;
  const arr = getRecent(); const sites = allSites();
  const valid = arr.filter(r => sites.some(s => s.u === r.u)).slice(0, DOCK_SHOW);
  if(!valid.length){ el.innerHTML = '<span class="dock-empty">访问过的网站会出现在这里</span>'; return; }
  el.innerHTML = valid.map(r => {
    const s = sites.find(x => x.u === r.u);
    const name = s ? s.n : r.n;
    return `<a class="dock-item" href="${esc(r.u)}" data-url="${esc(r.u)}" title="${esc(name)}">${esc(first(name))}</a>`;
  }).join('');
}

function getToday(){ return new Date().toDateString(); }
function getVisitedMap(){
  try{
    const raw = JSON.parse(localStorage.getItem('juzi-visited') || '{}');
    const out = {};
    for(const url in raw){ const v = raw[url]; if(typeof v === 'string') out[url] = { date:v, count:1 }; else if(v && typeof v === 'object') out[url] = { date:v.date || '', count:v.count || 0 }; }
    return out;
  }catch(e){ return {}; }
}
function setVisitedMap(m){ try{ localStorage.setItem('juzi-visited', JSON.stringify(m)); }catch(e){} }
function getTodayCount(url){ const map = getVisitedMap(); const rec = map[url]; return (rec && rec.date === getToday()) ? (rec.count || 0) : 0; }
function markVisited(url){
  const map = getVisitedMap(), today = getToday(), rec = map[url];
  if(rec && rec.date === today) rec.count = (rec.count || 0) + 1;
  else map[url] = { date:today, count:1 };
  setVisitedMap(map); updateVisitedStat();
}
function getTotalTodayCount(){
  const map = getVisitedMap(), today = getToday(); let sum = 0;
  for(const url in map){ const r = map[url]; if(r && r.date === today) sum += (r.count || 0); }
  return sum;
}
function updateVisitedStat(){ document.getElementById('stat-visited').textContent = getTotalTodayCount(); }

function updateDate(){ document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' }); }
function updateClock(){ const n = new Date(); document.getElementById('clock').textContent = `${pad2(n.getHours())}:${pad2(n.getMinutes())}`; }

function updateYearProgress(){
  const now = new Date(), y = now.getFullYear();
  const start = new Date(y,0,1).getTime(), end = new Date(y+1,0,1).getTime();
  const pct = ((now.getTime() - start) / (end - start)) * 100;
  document.getElementById('yearFill').style.width = pct.toFixed(2) + '%';
  document.getElementById('yearPct').textContent = pct.toFixed(0) + '%';
  const total = Math.round((end - start) / 86400000), passed = Math.floor((now.getTime() - start) / 86400000) + 1;
  document.getElementById('yearBlock').title = `${y} 年已过 ${passed} 天，还剩 ${total - passed} 天`;
}

function loadOffWork(){
  try{ const raw = localStorage.getItem(OFFWORK_KEY); if(raw){ const [h,m] = raw.split(':').map(Number); if(!isNaN(h) && !isNaN(m)){ offWorkHour = h; offWorkMin = m; } } }catch(e){}
  updateWorkTitle();
}
function saveOffWork(){ try{ localStorage.setItem(OFFWORK_KEY, `${offWorkHour}:${offWorkMin}`); }catch(e){} updateWorkTitle(); }
function updateWorkTitle(){ const b = document.getElementById('workBlock'); if(b) b.title = `上班 08:30 · 下班 ${pad2(offWorkHour)}:${pad2(offWorkMin)}（点击切换）`; }
function updateWork(){
  const block = document.getElementById('workBlock'), icon = document.getElementById('offworkIcon');
  const text = document.getElementById('offworkText'), timeEl = document.getElementById('worktime');
  if(!block || !icon || !text) return;
  const offStr = `${pad2(offWorkHour)}:${pad2(offWorkMin)}`;
  if(timeEl) timeEl.textContent = `08:30–${offStr}`;
  const now = new Date(), day = now.getDay();
  if(day === 0 || day === 6){
    block.classList.remove('done','before'); block.classList.add('weekend');
    icon.className = 'fas fa-mug-hot'; text.innerHTML = '<b>周末愉快</b>'; return;
  }
  block.classList.remove('weekend');
  const start = new Date(now); start.setHours(WORK_START_H, WORK_START_M, 0, 0);
  const end = new Date(now); end.setHours(offWorkHour, offWorkMin, 0, 0);
  if(now < start){
    const diff = start - now, h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
    block.classList.remove('done'); block.classList.add('before');
    icon.className = 'fas fa-coffee'; text.innerHTML = `距上班 <b>${pad2(h)}:${pad2(m)}:${pad2(s)}</b>`;
  }else if(now < end){
    const diff = end - now, h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
    block.classList.remove('done','before');
    icon.className = h > 0 ? 'fas fa-hourglass-half' : 'fas fa-hourglass-end';
    text.innerHTML = `距下班 <b>${pad2(h)}:${pad2(m)}:${pad2(s)}</b>`;
  }else{
    block.classList.add('done'); block.classList.remove('before');
    icon.className = 'fas fa-mug-hot'; text.innerHTML = '<b>已下班</b>';
  }
}
function bindWorkClick(){
  const b = document.getElementById('workBlock'); if(!b) return;
  b.addEventListener('click', () => {
    const idx = OFFWORK_OPTIONS.findIndex(([h,m]) => h === offWorkHour && m === offWorkMin);
    const next = (idx + 1) % OFFWORK_OPTIONS.length;
    [offWorkHour, offWorkMin] = OFFWORK_OPTIONS[next];
    saveOffWork(); updateWork();
  });
}

}

function moveFolder(fid, dir){
  const idx = state.folders.findIndex(f => f.id === fid);
  if(idx < 0) return;
  const to = idx + dir;
  if(to < 0 || to >= state.folders.length) return;
  [state.folders[idx], state.folders[to]] = [state.folders[to], state.folders[idx]];
  save();
  renderSidebar();
  renderSections();
  renderDock();
  setTimeout(() => {
    const sec = document.querySelector(`.category-section[data-id="${fid}"]`);
    if(sec){
      const secRect = sec.getBoundingClientRect();
      const cRect = websitesContainer.getBoundingClientRect();
      const top = websitesContainer.scrollTop + (secRect.top - cRect.top) - 8;
      navLockUntil = Date.now() + 700;
      websitesContainer.scrollTo({ top, behavior:'smooth' });
    }
  }, 30);
}

function renderSidebar(){
  const list = document.getElementById('category-list');
  const total = state.folders.reduce((a,f) => a + f.sites.length, 0);
  let html = `<li class="category-item">
    <a class="category-link${currentFilter === 'all' ? ' active' : ''}" data-category="all">
      <i class="fas fa-globe"></i>
      <span class="category-name">全部网站</span>
      <span class="category-count">${total}</span>
    </a>
  </li>`;

  html += state.folders.map((f, idx) => {
    const isFirst = idx === 0;
    const isLast = idx === state.folders.length - 1;
    const movers = editMode ? `<div class="nav-movers">
      <button class="nav-move" data-fid="${f.id}" data-dir="-1" ${isFirst ? 'disabled' : ''} title="上移">▲</button>
      <button class="nav-move" data-fid="${f.id}" data-dir="1" ${isLast ? 'disabled' : ''} title="下移">▼</button>
    </div>` : '';
    return `<li class="category-item">
      <a class="category-link${currentFilter === f.id ? ' active' : ''}" data-category="${f.id}">
        <i class="${f.icon}"></i>
        <span class="category-name">${esc(f.name)}</span>
        <span class="category-count">${f.sites.length}</span>
      </a>
      ${movers}
    </li>`;
  }).join('');

  list.innerHTML = html;

  list.querySelectorAll('.category-link').forEach(a => {

function renderSections(){
  const container = document.getElementById('sections');
  if(!state.folders.length){ container.innerHTML = '<div class="no-results"><i class="fas fa-folder-open"></i><div>暂无分类</div></div>'; return; }
  container.innerHTML = state.folders.map(f => {
    const siteHtml = f.sites.length ? f.sites.map((s, idx) => editMode ? editCardHTML(f, s, idx) : cardHTML(s)).join('') : '';
    const addHtml = editMode ? `<button class="add-card" data-add="${f.id}">＋ 添加网站</button>` : '';
    const titleHtml = editMode
      ? `<input class="cat-title-input" data-fid="${f.id}" value="${esc(f.name)}" spellcheck="false"><div class="cat-tools"><button class="cat-mini-btn" data-add="${f.id}" title="添加网站">＋</button><button class="cat-mini-btn danger" data-del-folder="${f.id}" title="删除分类">×</button></div>`
      : `<span class="cat-title-text">${esc(f.name)}</span><span style="font-size:12px;font-weight:500;color:var(--txt-3);flex:0 0 auto">${f.sites.length}</span>`;
    return `<section class="category-section" data-id="${f.id}"><div class="category-header"><i class="${f.icon}"></i>${titleHtml}</div><div class="websites-grid" data-fid="${f.id}">${siteHtml}${addHtml}</div></section>`;
  }).join('');
}
function cardHTML(s){
  const count = getTodayCount(s.u), hasVisit = count > 0;
  return `<div class="website-card" data-url="${esc(s.u)}">${iconHTML(s)}<div class="website-info"><div class="website-name" title="${esc(s.n)}">${esc(s.n)}</div><div class="website-url">${esc(domain(s.u))}</div></div><div class="website-actions"><button class="visit-btn" data-url="${esc(s.u)}"><i class="fas fa-external-link-alt"></i> 访问</button><span class="visit-count${hasVisit ? ' has-visit' : ''}">今日 ${count} 次</span></div></div>`;
}
function editCardHTML(f, s, idx){
  return `<div class="website-card editing" draggable="true" data-fid="${f.id}" data-i="${idx}" data-url="${esc(s.u)}">${iconHTML(s)}<div class="edit-fields"><input class="e-n" draggable="false" data-fid="${f.id}" data-i="${idx}" value="${esc(s.n)}" placeholder="网站名称" spellcheck="false"><input class="e-u" draggable="false" data-fid="${f.id}" data-i="${idx}" value="${esc(s.u)}" placeholder="https://…" spellcheck="false"></div><div class="card-move-btns"><button class="card-move-btn" data-move="up" data-fid="${f.id}" data-i="${idx}" ${idx === 0 ? 'disabled' : ''} title="上移">▲</button><button class="card-move-btn" data-move="down" data-fid="${f.id}" data-i="${idx}" ${idx === f.sites.length - 1 ? 'disabled' : ''} title="下移">▼</button></div><button class="e-del" data-fid="${f.id}" data-i="${idx}" title="删除">×</button></div>`;
}

function openSite(url, cardEl){
  markVisited(url); pushRecent(url);
  window.open(url, '_blank', 'noopener,noreferrer');
  if(cardEl){
    const count = getTodayCount(url), badge = cardEl.querySelector('.visit-count');
    if(badge){ badge.textContent = `今日 ${count} 次`; badge.classList.toggle('has-visit', count > 0); }
  }
}

document.getElementById('sections').addEventListener('click', e => {
  const moveBtn = e.target.closest('.card-move-btn');
  if(moveBtn && editMode){
    e.preventDefault(); e.stopPropagation();
    const fid = moveBtn.dataset.fid;
    const idx = +moveBtn.dataset.i;
    const dir = moveBtn.dataset.move === 'up' ? -1 : 1;
    const f = state.folders.find(x => x.id === fid);
    if(!f) return;
    const to = idx + dir;
    if(to < 0 || to >= f.sites.length) return;
    [f.sites[idx], f.sites[to]] = [f.sites[to], f.sites[idx]];
    save();
    renderSidebar();
    renderSections();
    renderDock();
    return;
  }

  const btn = e.target.closest('.visit-btn');
  if(btn && !editMode){ e.preventDefault(); e.stopPropagation(); openSite(btn.dataset.url, btn.closest('.website-card')); return; }
  if(editMode){
    const del = e.target.closest('.e-del');
    if(del){ const f = state.folders.find(x => x.id === del.dataset.fid); if(!f) return; f.sites.splice(+del.dataset.i, 1); save(); renderSidebar(); renderSections(); return; }
    const add = e.target.closest('[data-add]');

      }, 30);
      return;
    }
    const delFolder = e.target.closest('[data-del-folder]');
    if(delFolder){
      const fid = delFolder.dataset.delFolder, f = state.folders.find(x => x.id === fid); if(!f) return;

      if(idx > -1) state.folders.splice(idx, 1);
      save(); renderSidebar(); renderSections(); renderDock();
      return;
    }
  }
  if(!editMode){
    const card = e.target.closest('.website-card');
    if(card && !e.target.closest('.visit-btn')){ const url = card.dataset.url; if(url) openSite(url, card); }

  sectionsEl.querySelectorAll('.insert-before, .insert-after').forEach(el => el.classList.remove('insert-before', 'insert-after'));

sectionsEl.addEventListener('dragover', e => {
  if(!editMode || !dragSrc) return;
  const grid = e.target.closest('.websites-grid'); if(!grid) return;
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  sectionsEl.querySelectorAll('.insert-before, .insert-after').forEach(el => el.classList.remove('insert-before', 'insert-after'));
  sectionsEl.querySelectorAll('.websites-grid.drop-end').forEach(el => el.classList.remove('drop-end'));
  const card = e.target.closest('.website-card.editing');
  if(card && card !== sectionsEl.querySelector('.website-card.editing.dragging')){
    const rect = card.getBoundingClientRect(); const after = e.clientX > rect.left + rect.width / 2;
    card.classList.add(after ? 'insert-after' : 'insert-before');
  }else if(!card){ grid.classList.add('drop-end'); }
});
sectionsEl.addEventListener('drop', e => {
  if(!editMode || !dragSrc) return;
  const grid = e.target.closest('.websites-grid'); if(!grid) return;
  e.preventDefault();
  const dstF = state.folders.find(f => f.id === grid.dataset.fid);
  const srcF = state.folders.find(f => f.id === dragSrc.fid);
  if(!srcF || !dstF) return;
  let insertAt;
  const card = e.target.closest('.website-card.editing');
  if(card && card !== sectionsEl.querySelector('.website-card.editing.dragging')){
    const rect = card.getBoundingClientRect(); const after = e.clientX > rect.left + rect.width / 2;
    insertAt = +card.dataset.i + (after ? 1 : 0);
  }else{ insertAt = dstF.sites.length; }
  const [site] = srcF.sites.splice(dragSrc.idx, 1);
  if(srcF.id === dstF.id && dragSrc.idx < insertAt) insertAt--;
  dstF.sites.splice(insertAt, 0, site);
  save(); renderSidebar(); renderSections(); renderDock();
  sectionsEl.querySelectorAll('.insert-before, .insert-after').forEach(el => el.classList.remove('insert-before', 'insert-after'));
  sectionsEl.querySelectorAll('.websites-grid.drop-end').forEach(el => el.classList.remove('drop-end'));
  dragSrc = null;
});

quickLinksEl.addEventListener('drop', e => {

btnHealth.addEventListener('click', async () => {
  if(!editMode) return;
  const sites = allSites();
  if(!confirm(`将尝试检测 ${sites.length} 个网站的可达性（可能需要 1-2 分钟）。\n\n由于浏览器 CORS 限制，部分政府/内网站点可能被误判为“未知”，仅供参考。`)) return;

  btnHealth.disabled = true;
  btnHealth.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

  const results = {};
  let i = 0;
  const CONCURRENCY = 6;
  async function worker(){
    while(i < sites.length){
      const s = sites[i++];
      try{
        await fetch(s.u, { mode:'no-cors', method:'HEAD', signal: AbortSignal.timeout(6000) });
        results[s.u] = 'ok';
      }catch(err){
        if(err.name === 'TimeoutError' || err.name === 'AbortError') results[s.u] = 'unknown';
        else results[s.u] = 'fail';
      }
    }
  }
  await Promise.all(Array(CONCURRENCY).fill(0).map(worker));

  document.querySelectorAll('.website-card.editing').forEach(card => {
    const r = results[card.dataset.url];
    card.classList.remove('health-ok','health-fail','health-unknown');
    if(r === 'ok') card.classList.add('health-ok');
    else if(r === 'fail') card.classList.add('health-fail');
    else if(r === 'unknown') card.classList.add('health-unknown');
  });

  const fails = sites.filter(s => results[s.u] === 'fail');
  const unknowns = sites.filter(s => results[s.u] === 'unknown');
  const oks = sites.filter(s => results[s.u] === 'ok');

  healthSummary.innerHTML = `
    共检测 <b>${sites.length}</b> 个网站：
    <span style="color:#2e9e64"><b>${oks.length}</b> 个可达</span>，
    <span class="fail-count"><b>${fails.length}</b> 个疑似失效</span>，
    <span class="unknown-count"><b>${unknowns.length}</b> 个超时/未知</span>
  `;

  let bodyHtml = '';

  if(fails.length){
    bodyHtml += `<div class="health-group">
      <div class="health-group-title" style="color:#dc2626">疑似失效 (${fails.length})</div>
      ${fails.map(s => `
        <div class="health-item" data-url="${esc(s.u)}">
          <div class="h-icon" style="background:#dc2626">×</div>
          <div class="h-info">
            <div class="h-name">${esc(s.n)}</div>
            <div class="h-url">${esc(s.u)}</div>
          </div>
          <button class="h-del" data-url="${esc(s.u)}" title="从导航中删除">×</button>
        </div>
      `).join('')}
    </div>`;
  }

  if(unknowns.length){
    bodyHtml += `<div class="health-group">
      <div class="health-group-title" style="color:#d97706">超时 / 未知 (${unknowns.length})</div>
      ${unknowns.map(s => `
        <div class="health-item" data-url="${esc(s.u)}">
          <div class="h-icon" style="background:#d97706">?</div>
          <div class="h-info">
            <div class="h-name">${esc(s.n)}</div>
            <div class="h-url">${esc(s.u)}</div>
          </div>
          <button class="h-del" data-url="${esc(s.u)}" title="从导航中删除">×</button>
        </div>
      `).join('')}
    </div>`;
  }

  if(!fails.length && !unknowns.length){
    bodyHtml = `<div class="health-empty">
      <i class="fas fa-check-circle" style="font-size:32px;color:#2e9e64;margin-bottom:10px;display:block"></i>
      太棒了，没有发现失效链接！
    </div>`;
  }

  healthBody.innerHTML = bodyHtml;

  healthBody.querySelectorAll('.h-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const url = btn.dataset.url;
      if(!confirm('确定要从导航中彻底删除这个网站吗？')) return;

      let found = false;
      for(const f of state.folders){
        const idx = f.sites.findIndex(s => s.u === url);
        if(idx > -1){
          f.sites.splice(idx, 1);
          found = true;
          break;
        }
      }
      if(found){
        save();
        renderSidebar();
        renderSections();
        renderDock();
        const item = btn.closest('.health-item');
        if(item) item.remove();
        const group = btn.closest('.health-group');
        if(group && group.querySelectorAll('.health-item').length === 0) group.remove();
        if(healthBody.querySelectorAll('.health-item').length === 0){
          healthBody.innerHTML = `<div class="health-empty">
            <i class="fas fa-check-circle" style="font-size:32px;color:#2e9e64;margin-bottom:10px;display:block"></i>
            太棒了，没有发现失效链接！
          </div>`;
        }
      }
    });
  });

  healthPanel.classList.add('open');

  btnHealth.disabled = false;
  btnHealth.innerHTML = '<i class="fas fa-heart-pulse"></i>';
});

function updateNavByScroll(){
  if(Date.now() < navLockUntil) return;
  const sections = [...document.querySelectorAll('.category-section')];
  if(!sections.length) return;
  if(websitesContainer.scrollTop < 20){ setActiveNav('all'); return; }
  if(websitesContainer.scrollTop + websitesContainer.clientHeight >= websitesContainer.scrollHeight - 8){ setActiveNav(sections[sections.length-1].dataset.id); return; }
  const cTop = websitesContainer.getBoundingClientRect().top, offset = 60;
  let cur = sections[0].dataset.id;
  for(const sec of sections){ const rect = sec.getBoundingClientRect(); if(rect.top - cTop <= offset) cur = sec.dataset.id; else break; }
  setActiveNav(cur);
}

});
document.getElementById('btnClearRecent').addEventListener('click', clearRecent);

document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== document.getElementById('baiduInput')){ e.preventDefault(); document.getElementById('baiduInput').focus(); }
  if(e.key === 'Escape'){
    if(document.activeElement === document.getElementById('baiduInput')) document.getElementById('baiduInput').blur();
    themePop.classList.remove('open'); exportDrop.classList.remove('open');
    healthPanel.classList.remove('open');
    closeMobileSidebar();
  }
});

(function init(){
  state = load(); quickLinks = loadQuick();
  applyTheme(state.theme); initMode(); initDensity();
  loadOffWork();
  updateDate(); updateClock(); updateYearProgress(); updateWork(); updateVisitedStat();
  renderQuickLinks(); renderSidebar(); renderSections(); renderDock();
  bindWorkClick();
  setActiveNav('all');
  setInterval(() => { updateDate(); updateClock(); updateYearProgress(); updateWork(); }, 1000);
})();
</script>
