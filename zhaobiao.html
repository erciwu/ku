<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>大连市招采平台导航</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
(function(){
  try{
    var t = localStorage.getItem('dlzb-theme') || 'auto';
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', t === 'auto' ? (dark ? 'dark' : 'light') : t);
  }catch(e){}
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
  background:var(--bg-page);
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  color:var(--text-1);
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease;
}

:root{
  --primary:#1677FF;
  --primary-hover:#4096FF;
  --primary-active:#0958D9;
  --primary-bg:#E6F4FF;
  --primary-bg-hover:#BAE0FF;

  --bg-page:#F0F5FF;
  --bg-container:#FFFFFF;
  --bg-elevated:#FFFFFF;
  --bg-hover:#F2F3F5;
  --bg-fill:#F7F8FA;

  --border:#E5E6EB;
  --border-strong:#C9CDD4;

  --text-1:#1D2129;
  --text-2:#4E5969;
  --text-3:#86909C;
  --text-4:#C9CDD4;

  --success:#00B42A;
  --success-bg:#E8FFEA;
  --warning:#FF7D00;
  --warning-bg:#FFF7E8;
  --danger:#F53F3F;
  --danger-bg:#FFECE8;

  --radius-sm:4px;
  --radius:6px;
  --radius-lg:8px;
  --radius-xl:12px;

  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 10px rgba(0,0,0,.06);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}

:root[data-theme="dark"]{
  --primary:#3C88FF;
  --primary-hover:#5C9DFF;
  --primary-active:#2E74E6;
  --primary-bg:rgba(60,136,255,.15);
  --primary-bg-hover:rgba(60,136,255,.25);

  --bg-page:#17171A;
  --bg-container:#232324;
  --bg-elevated:#2A2A2D;
  --bg-hover:#2E2E32;
  --bg-fill:#1C1C1F;

  --border:#333335;
  --border-strong:#4E4E52;

  --text-1:#F7F8FA;
  --text-2:#A9AEB8;
  --text-3:#6B6E76;
  --text-4:#4E4E52;

  --success:#23C343;
  --success-bg:rgba(35,195,67,.15);
  --warning:#FF9A2E;
  --warning-bg:rgba(255,154,46,.15);
  --danger:#F76560;
  --danger-bg:rgba(247,101,96,.15);

  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 10px rgba(0,0,0,.4);
  --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}

.app{
  width:100%;
  max-width:1800px;
  height:calc(100vh - 32px);
  background:var(--bg-container);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}

/* ===== 顶栏 ===== */
.topbar{
  height:68px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 24px;
  background:linear-gradient(180deg,#1266e3 0%,#0A57C7 55%,#0949b0 100%);
  border-bottom:1px solid rgba(0,0,0,.12);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);
  position:relative;
  z-index:20;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
  min-width:0;
}
.logo{
  width:34px;height:34px;
  background:linear-gradient(135deg,#FFB84D,#FF8A3D);
  border-radius:var(--radius-lg);
  display:grid;
  place-items:center;
  font-size:16px;
  color:#fff;
  flex:0 0 auto;
  box-shadow:0 2px 6px rgba(255,140,60,.35);
}
.brand-name{
  font-size:19px;
  font-weight:700;
  color:#fff;
  letter-spacing:.3px;
  white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.12);
}
.top-divider{
  width:1px;
  height:22px;
  background:rgba(255,255,255,.22);
  flex:0 0 auto;
}

/* ===== 顶栏搜索 ===== */
.topbar-search{
  flex:1 1 auto;
  max-width:420px;
  min-width:160px;
  position:relative;
  display:flex;
  align-items:center;
  margin:0 6px;
}
.topbar-search input{
  width:100%;
  height:36px;
  background:rgba(255,255,255,.95);
  border:1px solid transparent;
  border-radius:var(--radius-lg);
  padding:0 78px 0 36px;
  font-family:inherit;
  font-size:13.5px;
  color:var(--text-1);
  outline:none;
  transition:all .15s;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.04);
}
.topbar-search input::placeholder{color:var(--text-3)}
.topbar-search input:hover{background:#fff}
.topbar-search input:focus{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.topbar-search > i{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  color:var(--text-3);
  pointer-events:none;
}
.topbar-search button{
  position:absolute;
  right:3px;
  top:50%;
  transform:translateY(-50%);
  height:30px;
  padding:0 14px;
  border:none;
  border-radius:var(--radius);
  background:var(--primary);
  color:#fff;
  font-family:inherit;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  transition:all .15s;
  box-shadow:0 1px 3px rgba(22,119,255,.3);
}
.topbar-search button:hover{background:var(--primary-hover);box-shadow:0 2px 6px rgba(22,119,255,.35)}
.topbar-search button:active{background:var(--primary-active)}

.stats-inline{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:rgba(255,255,255,.8);
  white-space:nowrap;
}
.stats-inline b{color:#fff;font-weight:600;font-size:12.5px}
.stats-inline .dot{color:rgba(255,255,255,.35);margin:0 2px}

.header-tools{
  display:flex;
  align-items:center;
  gap:4px;
  flex:0 0 auto;
  margin-left:auto;
  position:relative;
}
.htool{
  width:34px;height:34px;
  border-radius:var(--radius);
  display:grid;
  place-items:center;
  cursor:pointer;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  font-family:inherit;
  font-size:14px;
  transition:all .15s ease;
  text-decoration:none;
}
.htool:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.34);color:#fff}

/* ===== 主内容 ===== */
.body{
  flex:1;
  display:flex;
  overflow:hidden;
  background:var(--bg-page);
}

/* ===== 侧栏 ===== */
.sidebar{
  width:236px;
  flex:0 0 236px;
  background:var(--bg-container);
  border-right:1px solid var(--border);
  padding:16px 12px;
  overflow-y:auto;
  scrollbar-width:none;
  position:relative;
  display:flex;
  flex-direction:column;
}
.sidebar::-webkit-scrollbar{display:none}

.date-display{
  background:linear-gradient(135deg,#E6F4FF,#F0F7FF);
  padding:11px 14px;
  border-radius:var(--radius-lg);
  margin-bottom:14px;
  color:var(--primary-active);
  font-weight:500;
  font-size:12.5px;
  border:1px solid #D6E8FF;
  display:flex;
  align-items:center;
  gap:8px;
}
.date-display i{font-size:13px;color:var(--primary)}
:root[data-theme="dark"] .date-display{
  background:linear-gradient(135deg,rgba(60,136,255,.15),rgba(60,136,255,.08));
  border-color:rgba(60,136,255,.25);
  color:#5C9DFF;
}
:root[data-theme="dark"] .date-display i{color:#5C9DFF}

.category-list{list-style:none}
.category-item{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.category-item + .category-item{border-top:1px solid var(--border);padding-top:2px}
.category-link{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 11px;
  border-radius:var(--radius);
  color:var(--text-2);
  font-size:13px;
  font-weight:400;
  cursor:pointer;
  text-decoration:none;
  transition:all .14s ease;
  border:1px solid transparent;
}
.category-link:hover{background:var(--bg-hover);color:var(--text-1)}
.category-link.active{background:var(--primary);color:#fff;font-weight:500;box-shadow:0 2px 6px rgba(22,119,255,.2)}
.category-link.active i{color:#fff}
.category-link i{
  width:14px;
  font-size:12px;
  color:var(--text-3);
  text-align:center;
  flex:0 0 14px;
  transition:color .14s;
}
.category-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category-count{
  font-size:11px;
  color:var(--text-3);
  font-weight:500;
  flex:0 0 auto;
  padding:0 6px;
  height:18px;
  line-height:18px;
  border-radius:9px;
  background:var(--bg-fill);
  font-variant-numeric:tabular-nums;
  transition:all .14s;
}
.category-link.active .category-count{
  background:rgba(255,255,255,.22);
  color:#fff;
}

.announcement{
  margin-top:auto;
  padding-top:12px;
  border-top:1px solid var(--border);
}
.announcement-title{
  font-size:11px;
  font-weight:600;
  color:var(--text-3);
  letter-spacing:.5px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.announcement-title i{color:var(--warning);font-size:11px}
.announcement a{
  display:block;
  font-size:12px;
  color:var(--primary);
  text-decoration:none;
  line-height:1.5;
  padding:7px 9px;
  border-radius:var(--radius);
  background:var(--primary-bg);
  border:1px solid var(--primary-bg-hover);
  transition:background .12s;
}
.announcement a:hover{background:var(--primary-bg-hover)}

/* ===== 内容区 ===== */
.content{
  flex:1;
  overflow-y:auto;
  padding:20px 24px 80px;
  background:var(--bg-page);
  scroll-behavior:smooth;
}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;border:2px solid var(--bg-page)}
.content::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

.category-section{margin-bottom:26px;scroll-margin-top:8px}
.category-section:last-child{margin-bottom:0}

.category-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  padding:0 2px;
}
.category-header i{
  display:grid;
  place-items:center;
  width:24px;
  height:24px;
  border-radius:var(--radius);
  background:var(--primary-bg);
  color:var(--primary);
  font-size:12px;
  flex:0 0 24px;
}
.cat-title-text{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:15px;
  font-weight:600;
  color:var(--text-1);
  letter-spacing:.2px;
}
.section-count{
  font-size:12px;
  color:var(--text-3);
  font-weight:400;
  flex:0 0 auto;
  padding:0 8px;
  height:20px;
  line-height:20px;
  border-radius:10px;
  background:var(--bg-fill);
  font-variant-numeric:tabular-nums;
}

.websites-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  min-height:40px;
}

/* ===== 卡片：名称占满整行，次数与网址同行 ===== */
.website-card{
  background:var(--bg-container);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:68px;
  cursor:pointer;
  position:relative;
  min-width:0;
  transition:all .15s ease;
}
.website-card:hover{
  border-color:var(--primary-bg-hover);
  box-shadow:var(--shadow);
  transform:translateY(-1px);
}
.website-card.dragging{opacity:.4;border-style:dashed;border-color:var(--primary)}
.website-card.drag-over{border-color:var(--primary);border-width:2px;background:var(--primary-bg)}

.website-icon{
  width:40px;height:40px;
  flex:0 0 40px;
  border-radius:var(--radius-lg);
  background:var(--primary-bg);
  color:var(--primary);
  display:grid;
  place-items:center;
  font-size:16px;
  font-weight:600;
  line-height:1;
  transition:all .15s ease;
}
.website-card:hover .website-icon{
  background:var(--primary);
  color:#fff;
  box-shadow:0 2px 8px rgba(22,119,255,.3);
}

.website-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.website-name{
  font-size:14.5px;
  font-weight:700;
  color:var(--text-1);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.2px;
}
.website-meta{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.website-url{
  flex:1;
  min-width:0;
  font-size:11.5px;
  color:var(--text-3);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.visit-count{
  flex:0 0 auto;
  font-size:10.5px;
  color:var(--text-3);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  padding:1px 7px;
  height:18px;
  line-height:16px;
  border-radius:9px;
  background:var(--bg-fill);
  border:1px solid var(--border);
  transition:all .15s;
}
.visit-count.has-visit{
  background:var(--success-bg);
  color:var(--success);
  border-color:rgba(0,180,42,.28);
  font-weight:500;
}
:root[data-theme="dark"] .visit-count.has-visit{
  border-color:rgba(35,195,67,.3);
}

.card-arrow{
  flex:0 0 auto;
  font-size:11px;
  color:var(--primary);
  opacity:0;
  transition:all .15s;
}
.website-card:hover .card-arrow{opacity:1;transform:translateX(2px)}

.drag-hint{
  flex:0 0 auto;
  font-size:11px;
  color:var(--text-4);
  cursor:grab;
  opacity:0;
  transition:opacity .15s;
}
.website-card:hover .drag-hint{opacity:.55}
.website-card:active .drag-hint{cursor:grabbing}

.no-results{
  text-align:center;
  padding:60px 20px;
  color:var(--text-3);
  font-size:13px;
  background:var(--bg-container);
  border-radius:var(--radius-xl);
  border:1px solid var(--border);
}

/* ===== Dock ===== */
.dock{
  height:60px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 24px;
  background:var(--bg-container);
  border-top:1px solid var(--border);
  position:relative;
  z-index:10;
}
.dock-label{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:500;
  color:var(--text-2);
  white-space:nowrap;
  padding-right:14px;
  border-right:1px solid var(--border);
}
.dock-label i{font-size:11px;color:var(--warning)}
.dock-items{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  align-items:center;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:4px 0;
}
.dock-items::-webkit-scrollbar{display:none}
.dock-item{
  flex:0 0 auto;
  height:32px;
  padding:0 12px;
  border-radius:var(--radius);
  background:var(--bg-fill);
  border:1px solid transparent;
  color:var(--text-2);
  font-size:12px;
  font-weight:500;
  text-decoration:none;
  cursor:pointer;
  white-space:nowrap;
  transition:all .14s;
  display:inline-flex;
  align-items:center;
  font-family:inherit;
}
.dock-item:hover{background:var(--primary-bg);color:var(--primary);border-color:var(--primary-bg-hover)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

.mobile-menu-btn{display:none}
.sidebar-close-btn{display:none}
.sidebar-overlay{display:none}

/* ===== 响应式 ===== */
@media (max-width:1500px){
  .topbar-search{max-width:340px}
}
@media (max-width:1400px){
  .sidebar{width:220px;flex:0 0 220px}
  .brand-name{font-size:18px}
  .topbar-search{max-width:300px}
  .topbar{gap:12px;padding:0 20px}
}
@media (max-width:1260px){
  .stats-inline{display:none}
}
@media (max-width:1200px){
  .websites-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sidebar{width:208px;flex:0 0 208px}
}
@media (max-width:1024px){
  .sidebar{width:196px;flex:0 0 196px;padding:14px 10px}
  .content{padding:16px 18px 70px}
  .topbar-search{max-width:260px}
}
@media (max-width:900px){
  .websites-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar{gap:10px;padding:0 16px}
  .brand-name{font-size:17px}
}

@media (max-width:820px){
  body{padding:10px}
  .app{height:calc(100vh - 20px);border-radius:var(--radius-lg)}

  .topbar{
    padding:10px 14px;
    gap:10px;
    row-gap:8px;
    height:auto;
    flex-wrap:wrap;
  }
  .logo{width:30px;height:30px;font-size:15px;border-radius:var(--radius)}
  .brand-name{font-size:16px}
  .top-divider{display:none}

  .topbar-search{
    order:3;
    flex:1 1 100%;
    max-width:none;
    min-width:0;
    margin:0;
  }
  .topbar-search input{height:36px;font-size:13px;padding-right:74px}
  .topbar-search button{height:28px;padding:0 13px;font-size:12px}

  .header-tools{order:2;margin-left:auto;gap:2px}
  .htool{width:30px;height:30px;font-size:13px}

  .mobile-menu-btn{
    display:grid;
    width:30px;height:30px;
    border-radius:var(--radius);
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.22);
    color:#fff;
    font-size:13px;
    cursor:pointer;
    place-items:center;
    flex:0 0 auto;
    font-family:inherit;
  }

  .body{flex-direction:row}
  .sidebar{
    position:fixed;
    top:0;left:0;bottom:0;
    width:80%;
    max-width:300px;
    background:var(--bg-container);
    border-right:1px solid var(--border);
    padding:52px 14px 16px;
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:200;
    box-shadow:6px 0 24px rgba(0,0,0,.15);
  }
  .sidebar.mobile-open{transform:none}
  .sidebar-close-btn{
    display:grid;
    position:absolute;
    top:12px;right:12px;
    width:28px;height:28px;
    border-radius:50%;
    background:var(--bg-fill);
    border:1px solid var(--border);
    color:var(--text-2);
    font-size:12px;
    cursor:pointer;
    place-items:center;
    z-index:2;
    font-family:inherit;
  }
  .sidebar-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:199;
    opacity:0;
    transition:opacity .25s ease;
    pointer-events:none;
  }
  .sidebar-overlay.show{display:block;opacity:1;pointer-events:auto}

  .content{padding:16px 14px 70px}
  .websites-grid{grid-template-columns:1fr;gap:8px}
  .category-header{margin-bottom:10px}
  .cat-title-text{font-size:14px}
  .category-section{margin-bottom:20px}
  .website-card{padding:11px 12px;min-height:60px;gap:10px}
  .website-icon{width:36px;height:36px;flex:0 0 36px;font-size:14px}
  .website-name{font-size:13.5px}
  .website-url{font-size:11px}
  .visit-count{display:inline-flex;font-size:10px}
  .card-arrow{opacity:1}

  .dock{padding:0 14px;height:52px;gap:10px}
  .dock-label{display:none}
  .dock-item{height:28px;font-size:11.5px;padding:0 10px}
}

@media (max-width:560px){
  .brand-name{font-size:15px}
  .website-card{flex-wrap:wrap}
  .website-meta{flex-wrap:wrap}
  .card-arrow{display:none}
}

const categoryNames = {

/* ============================================================
   访问记录
   ============================================================ */
const VISITED_KEY = 'dlzb-visited-v2';
const OLD_VISITED_KEY = 'visitedSites';

function getToday(){ return new Date().toDateString(); }

function migrateOldVisited(){
  try{
    const oldRaw = localStorage.getItem(OLD_VISITED_KEY);
    if(!oldRaw) return;
    const old = JSON.parse(oldRaw);
    const map = {};
    for(const url in old){
      const v = old[url];
      if(typeof v === 'string') map[url] = { date:v, count:1 };
      else if(v && typeof v === 'object') map[url] = { date:v.date || '', count:v.count || 0 };
    }
    localStorage.setItem(VISITED_KEY, JSON.stringify(map));
    localStorage.removeItem(OLD_VISITED_KEY);
  }catch(e){}
}

function getVisitedMap(){
  try{
    const raw = JSON.parse(localStorage.getItem(VISITED_KEY) || '{}');
    const out = {};
    for(const url in raw){
      const v = raw[url];
      if(typeof v === 'string') out[url] = { date:v, count:1 };
      else if(v && typeof v === 'object') out[url] = { date:v.date || '', count:v.count || 0 };
    }
    return out;
  }catch(e){ return {}; }
}
function setVisitedMap(m){ try{ localStorage.setItem(VISITED_KEY, JSON.stringify(m)); }catch(e){} }
function getTodayCount(url){ const map = getVisitedMap(); const rec = map[url]; return (rec && rec.date === getToday()) ? (rec.count || 0) : 0; }
function updateVisitedStat(){
  const map = getVisitedMap(), today = getToday(); let sum = 0;
  for(const url in map){ const r = map[url]; if(r && r.date === today) sum += (r.count || 0); }
  document.getElementById('visited-today').textContent = sum;
}

function updateDate(){
  document.getElementById('current-date').textContent =
    new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
}

/* ============================================================
   侧栏分类
   ============================================================ */
let activeCategory = null;

function renderSidebar(){
  const list = document.getElementById('category-list');
  list.innerHTML = categoryOrder.map(cat => {
    const count = websites.filter(w => w.category === cat).length;
    return `<li class="category-item">
      <a class="category-link${activeCategory === cat ? ' active' : ''}" data-category="${cat}">
        <i class="${categoryIcons[cat]}"></i>
        <span class="category-name">${categoryNames[cat]}</span>
        <span class="category-count">${count}</span>
      </a>
    </li>`;
  }).join('');

  list.querySelectorAll('.category-link').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const cat = a.dataset.category;
      const container = document.getElementById('websites-container');
      const sec = container.querySelector(`.category-section[data-category="${cat}"]`);
      if(!sec) return;
      const top = sec.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop - 8;
      container.scrollTo({ top: Math.max(top, 0), behavior:'smooth' });
      setActiveCategory(cat);
      closeMobileSidebar();
    });
  });

  document.getElementById('total-sites').textContent = websites.length;
}

function setActiveCategory(cat){
  if(activeCategory === cat) return;
  activeCategory = cat;
  document.querySelectorAll('.category-link').forEach(a => {
    a.classList.toggle('active', a.dataset.category === cat);
  });
}

function updateActiveByScroll(){
  const container = document.getElementById('websites-container');
  const sections = Array.from(container.querySelectorAll('.category-section'));
  if(!sections.length) return;
  const cTop = container.getBoundingClientRect().top;
  const threshold = 70;
  let active = sections[0].dataset.category;
  for(const sec of sections){
    const rect = sec.getBoundingClientRect();
    if(rect.top - cTop <= threshold) active = sec.dataset.category;
    else break;
  }
  if(container.scrollTop + container.clientHeight >= container.scrollHeight - 4){
    active = sections[sections.length - 1].dataset.category;
  }
  setActiveCategory(active);
}

/* ============================================================
   渲染网站
   ============================================================ */
function renderWebsites(){
  const container = document.getElementById('websites-container');
  const keepScroll = container.scrollTop;
  container.innerHTML = '';

  if(!websites.length){
    container.innerHTML = '<div class="no-results">暂无网站数据</div>';
    return;
  }

  categoryOrder.forEach(cat => {
    const items = websites.filter(w => w.category === cat);
    if(!items.length) return;

    const sec = document.createElement('section');
    sec.className = 'category-section';
    sec.dataset.category = cat;

    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `<i class="${categoryIcons[cat]}"></i><span class="cat-title-text">${categoryNames[cat]}</span><span class="section-count">${items.length}</span>`;
    sec.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'websites-grid';
    items.forEach(w => {
      const globalIdx = websites.indexOf(w);
      grid.appendChild(createCard(w, globalIdx));
    });

    sec.appendChild(grid);
    container.appendChild(sec);
  });

  container.scrollTop = keepScroll;
  updateActiveByScroll();
}

function domain(u){
  try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u || ''; }
}

function escAttr(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function createCard(website, globalIdx){
  const count = getTodayCount(website.url), hasVisit = count > 0;
  const card = document.createElement('div');
  card.className = 'website-card';
  card.draggable = true;
  card.dataset.index = globalIdx;
  card.dataset.url = website.url;
  card.dataset.category = website.category;

  card.innerHTML = `
    <div class="website-icon"><i class="${website.icon}"></i></div>
    <div class="website-info">
      <div class="website-name" title="${escAttr(website.name)}">${escAttr(website.name)}</div>
      <div class="website-meta">
        <span class="website-url" title="${escAttr(domain(website.url))}">${escAttr(domain(website.url))}</span>
        <span class="visit-count${hasVisit ? ' has-visit' : ''}">今日 ${count} 次</span>
      </div>
    </div>
    <i class="fas fa-arrow-right card-arrow"></i>
    <span class="drag-hint" title="拖动可交换位置"><i class="fas fa-grip-vertical"></i></span>
  `;

  card.addEventListener('click', e => {
    if(e.target.closest('.drag-hint')) return;
    openSite(website.url, card);
  });

  card.addEventListener('dragstart', handleDragStart);
  card.addEventListener('dragend', handleDragEnd);
  card.addEventListener('dragover', handleDragOver);
  card.addEventListener('dragleave', handleDragLeave);
  card.addEventListener('drop', handleDrop);

  return card;
}

function openSite(url, cardEl){
  const map = getVisitedMap();
  const today = getToday();
  const rec = map[url];
  if(rec && rec.date === today) rec.count = (rec.count || 0) + 1;
  else map[url] = { date:today, count:1 };
  setVisitedMap(map);
  updateVisitedStat();

  window.open(url, '_blank', 'noopener,noreferrer');

  if(cardEl){
    const count = map[url].count;
    const badge = cardEl.querySelector('.visit-count');
    if(badge){
      badge.textContent = `今日 ${count} 次`;
      badge.classList.add('has-visit');
    }
  }
}

/* ============================================================
   拖拽排序
   ============================================================ */
let dragSrcIndex = null;

function handleDragStart(e){
  const idx = parseInt(this.dataset.index);
  dragSrcIndex = idx;
  this.classList.add('dragging');
  try{
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(idx));
  }catch(err){}
}
function handleDragEnd(){
  this.classList.remove('dragging');
  document.querySelectorAll('.website-card.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragSrcIndex = null;
}
function handleDragOver(e){
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  this.classList.add('drag-over');
}
function handleDragLeave(){
  this.classList.remove('drag-over');
}
function handleDrop(e){
  e.preventDefault();
  this.classList.remove('drag-over');
  let srcIdx = dragSrcIndex;
  try{
    const data = e.dataTransfer.getData('text/plain');
    if(data) srcIdx = parseInt(data);
  }catch(err){}
  const tgtIdx = parseInt(this.dataset.index);
  if(isNaN(srcIdx) || isNaN(tgtIdx) || srcIdx === tgtIdx) return;
  [websites[srcIdx], websites[tgtIdx]] = [websites[tgtIdx], websites[srcIdx]];
  renderWebsites();
}

/* ============================================================
   主题
   ============================================================ */
const THEME_KEY = 'dlzb-theme';
const THEME_ORDER = ['auto','light','dark'];

function getThemePref(){ return localStorage.getItem(THEME_KEY) || 'auto'; }

function applyTheme(){
  const pref = getThemePref();
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const effective = pref === 'auto' ? (systemDark ? 'dark' : 'light') : pref;
  document.documentElement.setAttribute('data-theme', effective);

  const btn = document.getElementById('theme-toggle');
  if(btn){
    const icon = btn.querySelector('i');
    icon.className = pref === 'auto' ? 'fas fa-circle-half-stroke'
                   : pref === 'light' ? 'fas fa-sun'
                   : 'fas fa-moon';
    const label = pref === 'auto' ? '跟随系统' : pref === 'light' ? '浅色' : '深色';
    btn.title = '主题：' + label + '（点击切换）';
  }
}

function setupToolButtons(){
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const cur = getThemePref();
    const next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length];
    localStorage.setItem(THEME_KEY, next);
    applyTheme();
  });

  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => { if(getThemePref() === 'auto') applyTheme(); };
  if(mq.addEventListener) mq.addEventListener('change', onChange);
  else if(mq.addListener) mq.addListener(onChange);
}

/* ============================================================
   收藏
   ============================================================ */
function setupFavorite(){
  const btn = document.getElementById('btnFav');
  if(!btn) return;
  btn.addEventListener('click', () => {
    const url = location.href, title = document.title;
    let done = false;
    try{
      if(window.sidebar && window.sidebar.addPanel){ window.sidebar.addPanel(title, url, ''); done = true; }
      else if(window.external && ('AddFavorite' in window.external)){ window.external.AddFavorite(url, title); done = true; }
    }catch(e){}
    if(done){
      btn.innerHTML = '<i class="fas fa-star"></i>';
      return;
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(() => {
          btn.innerHTML = '<i class="fas fa-star"></i>';
          alert('链接已复制，请按 Ctrl+D（Mac 为 Command+D）收藏本页');
        }).catch(() => {
          alert('请按 Ctrl+D（Mac 为 Command+D）收藏本页');
        });
      }else{
        alert('请按 Ctrl+D（Mac 为 Command+D）收藏本页');
      }
    }catch(e){
      alert('请按 Ctrl+D（Mac 为 Command+D）收藏本页');
    }
  });
}

}
if(mobileMenuBtn) mobileMenuBtn.addEventListener('click', () => {
  if(sidebarEl && sidebarEl.classList.contains('mobile-open')) closeMobileSidebar();
  else openMobileSidebar();
});
if(sidebarOverlay) sidebarOverlay.addEventListener('click', closeMobileSidebar);
if(sidebarCloseBtn) sidebarCloseBtn.addEventListener('click', closeMobileSidebar);

/* ============================================================
   滚动高亮
   ============================================================ */
function setupScrollSpy(){
  const container = document.getElementById('websites-container');
  let ticking = false;
  container.addEventListener('scroll', () => {
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      updateActiveByScroll();
      ticking = false;
    });
  }, { passive:true });
}

/* ============================================================
   初始化
   ============================================================ */
document.addEventListener('DOMContentLoaded', function(){
  migrateOldVisited();
  updateDate();
  updateVisitedStat();
  applyTheme();
  setupToolButtons();
  setupFavorite();

  activeCategory = categoryOrder[0];
  renderSidebar();
  renderWebsites();
  setupScrollSpy();
  updateActiveByScroll();
});
</script>
</body>
</html>
