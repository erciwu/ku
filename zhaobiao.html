<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大连地区招标与采购导航平台 · 简版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script>
        (function () {
            try {
                var t = localStorage.getItem('dlzb-theme') || 'auto';
                var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', t === 'auto' ? (dark ? 'dark' : 'light') : t);
                var d = localStorage.getItem('dlzb-density') || 'comfortable';
                document.documentElement.setAttribute('data-density', d === 'compact' ? 'compact' : 'comfortable');
            } catch (e) {}
        })();
    </script>
    <style>
        /* ============================================================
           变量：浅色 / 深色（对齐参考站配色体系）
           ============================================================ */
        :root {
            --bg-page: #f0f4f8;
            --bg-main: #f9fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-soft: #f8faff;

            --border: #e6e9f0;
            --border-card: #e2e8f0;
            --border-strong: #d0dcec;

            --text-primary: #1e3a6b;
            --text-body: #2c3e50;
            --text-card: #1e2f40;
            --text-muted: #5f6f82;

            --primary: #0E63DB;
            --primary-hover: #0b52b5;
            --primary-soft: #e8f1ff;
            --primary-soft-2: #e0ecff;

            --header-bg: #0E63DB;
            --header-text: #ffffff;

            --shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
            --dock-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);

            --visited-bg: #e1f5e8;
            --visited-text: #1f7044;
            --visited-border: #a0d8b0;

            --status-bg: #f0f4fa;
            --status-text: #4b5e71;
            --status-border: #cbd5e1;

            --count-bg: #eef2f6;
            --count-border: #d0dcec;

            --hover-bg: #e8f0fe;
            --scroll-track: #eef2f6;
            --scroll-thumb: #b6c6d8;
        }

        :root[data-theme="dark"] {
            --bg-page: #0c1017;
            --bg-main: #111823;
            --bg-sidebar: #151d29;
            --bg-card: #1a2333;
            --bg-soft: #19222f;

            --border: #26303f;
            --border-card: #2b3648;
            --border-strong: #38465b;

            --text-primary: #dbe4f0;
            --text-body: #b8c6d8;
            --text-card: #e4ebf5;
            --text-muted: #8b9bb0;

            --primary: #3b82f6;
            --primary-hover: #5a97f7;
            --primary-soft: #1b2b45;
            --primary-soft-2: #1b2b45;

            --header-bg: #17202e;
            --header-text: #f2f6fc;

            --shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3);
            --dock-shadow: 0 -4px 24px rgba(0, 0, 0, 0.45);

            --visited-bg: #163a26;
            --visited-text: #6ee7a0;
            --visited-border: #245c3c;

            --status-bg: #202b3b;
            --status-text: #9fb0c4;
            --status-border: #313d4f;

            --count-bg: #202b3b;
            --count-border: #313d4f;

            --hover-bg: #1e2b3f;
            --scroll-track: #161e29;
            --scroll-thumb: #37475c;
        }

        /* ============================================================
           重置 & 基础
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background-color 0.3s ease;
        }

        .container {
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 95vh;
            background-color: var(--bg-sidebar);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* ============================================================
           顶栏 —— 参照参考站：高度 64px，padding 0 24px
           ============================================================ */
        header {
            flex: 0 0 auto;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            background-color: var(--header-bg);
            color: var(--header-text);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            min-width: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
            min-width: 0;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            color: var(--header-text);
            background: linear-gradient(145deg, rgba(255,255,255,0.35), rgba(255,255,255,0.12));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 25px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
            margin-left: auto;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-item {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 3px 13px;
            border-radius: 20px;
            text-align: center;
            line-height: 1.15;
        }

        .stat-number {
            font-size: 15px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 10px;
            opacity: 0.9;
            display: block;
        }

        .header-tools {
            display: flex;
            gap: 6px;
        }

        .tool-btn {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.12);
            color: var(--header-text);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.26);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .tool-btn:active {
            transform: scale(0.94);
        }

        /* ============================================================
           主内容
           ============================================================ */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            background-color: var(--bg-main);
            transition: background-color 0.3s ease;
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 20px 16px;
            overflow-y: auto;
            flex-shrink: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .date-display {
            background-color: var(--primary-soft);
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            border: 1px solid var(--border-strong);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .date-display i {
            color: var(--primary);
        }

        .category-title {
            font-size: 15px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-title i {
            background-color: var(--primary-soft-2);
            padding: 6px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--primary);
        }

        .toc-list {
            list-style: none;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .toc-link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px 9px 18px;
            border-radius: 12px;
            color: var(--text-body);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
        }

        .toc-link::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 15px;
            border-radius: 2px;
            background: transparent;
            transition: background-color 0.2s;
        }

        .toc-link:hover {
            background-color: var(--hover-bg);
        }

        .toc-link.active {
            background-color: var(--primary-soft);
            color: var(--primary);
            font-weight: 700;
        }

        .toc-link.active::before {
            background: var(--primary);
        }

        .toc-link i {
            width: 18px;
            font-size: 15px;
            color: var(--primary);
            text-align: center;
        }

        .toc-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-count {
            background-color: var(--count-bg);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-body);
            border: 1px solid var(--count-border);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .toc-link.active .category-count {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .announcement-box {
            background-color: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .announcement-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .announcement-content a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            line-height: 1.5;
            display: block;
            padding: 6px 8px;
            border-radius: 12px;
            transition: background-color 0.2s;
        }

        .announcement-content a:hover {
            background-color: var(--primary-soft);
        }

        .websites-container {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            background-color: var(--bg-main);
            scroll-behavior: smooth;
            transition: background-color 0.3s ease;
        }

        .category-header {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 18px 0;
            padding-bottom: 8px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--border-strong);
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .category-header i {
            background-color: var(--primary-soft);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary);
            transition: background-color 0.3s ease;
        }

        .websites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .website-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 16px 18px;
            min-height: 82px;
            display: flex;
            align-items: center;
            cursor: grab;
            transition: box-shadow 0.2s, border-color 0.2s, opacity 0.2s,
                        background-color 0.3s ease, color 0.3s ease;
            user-select: none;
        }

        .website-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-card);
        }

        .website-card:active {
            cursor: grabbing;
        }

        .website-card.dragging {
            opacity: 0.4;
            border-style: dashed;
            border-color: var(--primary);
        }

        .website-card.drag-over {
            border-color: var(--primary);
            border-width: 2px;
            background-color: var(--primary-soft);
        }

        .website-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background-color: var(--primary-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--primary);
            margin-right: 16px;
            flex-shrink: 0;
            transition: background-color 0.3s ease;
        }

        .website-info {
            flex: 1;
            min-width: 0;
        }

        .website-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-card);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .website-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .visit-btn {
            background-color: var(--primary);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
            border: 1px solid var(--primary-hover);
            white-space: nowrap;
        }

        .visit-btn:hover {
            background-color: var(--primary-hover);
        }

        .visit-btn i {
            font-size: 11px;
        }

        .click-status {
            font-size: 12px;
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 500;
            background-color: var(--status-bg);
            color: var(--status-text);
            border: 1px solid var(--status-border);
            white-space: nowrap;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .clicked {
            background-color: var(--visited-bg);
            color: var(--visited-text);
            border-color: var(--visited-border);
        }

        .drag-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 8px;
            opacity: 0.45;
            cursor: grab;
        }

        .website-card:hover .drag-hint {
            opacity: 0.8;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 16px;
            background-color: var(--bg-card);
            border-radius: 32px;
            border: 1px solid var(--border-card);
        }

        .no-results i {
            font-size: 56px;
            margin-bottom: 16px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* ============================================================
           紧凑密度
           ============================================================ */
        :root[data-density="compact"] .websites-grid {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
            margin-bottom: 22px;
        }

        :root[data-density="compact"] .website-card {
            min-height: 62px;
            padding: 10px 14px;
            border-radius: 14px;
        }

        :root[data-density="compact"] .website-icon {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            font-size: 16px;
            margin-right: 12px;
        }

        :root[data-density="compact"] .website-name {
            font-size: 13px;
            margin-bottom: 5px;
        }

        :root[data-density="compact"] .visit-btn {
            padding: 4px 12px;
            font-size: 11px;
        }

        :root[data-density="compact"] .click-status {
            font-size: 11px;
            padding: 2px 9px;
        }

        :root[data-density="compact"] .drag-hint {
            display: none;
        }

        :root[data-density="compact"] .category-header {
            font-size: 16px;
            margin-bottom: 12px;
        }

        :root[data-density="compact"] .category-header i {
            width: 32px;
            height: 32px;
            font-size: 16px;
        }

        /* ============================================================
           Dock 快捷栏 —— 参照参考站：高度 64px，圆形图标按钮
           ============================================================ */
        .dock {
            flex: 0 0 auto;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 24px;
            background-color: var(--bg-sidebar);
            border-top: 1px solid var(--border);
            box-shadow: var(--dock-shadow);
            position: relative;
            z-index: 10;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .dock-label {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            padding-right: 14px;
            border-right: 1px solid var(--border);
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .dock-label i {
            font-size: 11px;
            opacity: 0.7;
        }

        .dock-items {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 7px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 4px 0;
        }

        .dock-items::-webkit-scrollbar {
            display: none;
        }

        .dock-item {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background-color: var(--primary-soft);
            border: 1px solid var(--border-strong);
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.3, 1),
                        box-shadow 0.16s ease, background-color 0.3s ease,
                        border-color 0.3s ease, color 0.3s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
            line-height: 1;
        }

        .dock-item:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 16px rgba(14, 99, 219, 0.24),
                        inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .dock-item:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Dock 提示文字（悬停显示） */
        .dock-item::after {
            content: attr(data-name);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background-color: var(--bg-card);
            color: var(--text-card);
            font-size: 11px;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            box-shadow: var(--shadow-card);
            z-index: 20;
        }

        .dock-item:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        :root[data-density="compact"] .dock {
            height: 56px;
            padding: 0 20px;
            gap: 10px;
        }

        :root[data-density="compact"] .dock-item {
            width: 34px;
            height: 34px;
            font-size: 13px;
        }

        :root[data-density="compact"] .dock-label {
            font-size: 11px;
        }

        /* ============================================================
           滚动条
           ============================================================ */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scroll-track);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 8px;
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 1200px) {
            .websites-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 12px 16px;
                max-height: none;
            }
            .date-display {
                display: none;
            }
            .toc-list {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 12px;
            }
            .toc-link {
                padding: 8px 14px;
                border-radius: 20px;
            }
            .toc-link::before {
                display: none;
            }
            .toc-link.active {
                background-color: var(--primary);
                color: #ffffff;
            }
            .toc-link.active i,
            .toc-link.active .category-count {
                color: #ffffff;
            }
            .toc-link.active .category-count {
                background-color: rgba(255, 255, 255, 0.3);
                border-color: rgba(255, 255, 255, 0.3);
            }
            .announcement-box {
                display: none;
            }
        }

        @media (max-width: 860px) {
            .header-content {
                flex-wrap: wrap;
                gap: 8px;
            }
            .header-right {
                margin-left: auto;
            }
            .stats .stat-item:nth-child(3) {
                display: none;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 8px;
            }
            .container {
                height: 100vh;
                border-radius: 16px;
            }
            .stat-item {
                padding: 3px 10px;
            }
            .stat-number {
                font-size: 13px;
            }
            .stat-label {
                font-size: 9px;
            }
            .websites-grid,
            :root[data-density="compact"] .websites-grid {
                grid-template-columns: 1fr;
            }
            .website-card,

                icon: "fas fa-building" },

                category: "national", icon: "fas fa-search" },

                icon: "fas fa-robot" },
            { name: "中国通用招标网（综合招标采购，必须注册供应商）", url: "https://www.china-tender.com.cn/", category: "national",
                icon: "fas fa-file-contract" },
            { name: "全国公共资源交易平台", url: "https://www.ggzy.gov.cn/", category: "national", icon: "fas fa-sitemap" },
            { name: "#企业中标项目查询#（查询2019年以来中标/成交信息）", url: "https://data.ggzy.gov.cn/#/home",
                category: "national", icon: "fas fa-database" }
        ];

        // ============================================================
        //  2. 分类映射
        // ============================================================
        const categoryIcons = {
            government: "fas fa-landmark",
            university: "fas fa-university",
            hospital: "fas fa-hospital",
            enterprise: "fas fa-industry",
            national: "fas fa-globe-asia"
        };
        const categoryNames = {
            government: "政府平台",
            university: "高校采购",
            hospital: "医院采购",
            enterprise: "国企/企业",
            national: "全国平台"
        };
        const categoryOrder = ["government", "hospital", "university", "enterprise", "national"];

        // ============================================================
        //  3. 状态
        // ============================================================
        let dragSrcIndex = null;
        let activeTocCategory = null;

        // ============================================================
        //  4. 工具函数
        // ============================================================
        function getVisitedMap() {
            return JSON.parse(localStorage.getItem('visitedSites') || '{}');
        }

        function setVisitedMap(map) {
            localStorage.setItem('visitedSites', JSON.stringify(map));
        }

        function getToday() {
            return new Date().toDateString();
        }

        function updateVisitedToday() {
            const map = getVisitedMap();
            const today = getToday();
            let count = 0;
            for (let url in map) {
                if (map[url] === today) count++;
            }
            document.getElementById('visited-today').textContent = count;
        }

        function updateCurrentDate() {
            const now = new Date();
            document.getElementById('current-date').textContent =
                now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }

        function updateCounts() {
            const total = websites.length;
            document.getElementById('total-sites').textContent = total;

            const counts = { government: 0, hospital: 0, university: 0, enterprise: 0, national: 0 };
            websites.forEach(w => {
                if (counts[w.category] !== undefined) counts[w.category]++;
            });
            Object.keys(counts).forEach(cat => {
                const el = document.getElementById('count-' + cat);
                if (el) el.textContent = counts[cat];
            });
        }

        // ============================================================
        //  5. 目录（文档大纲）
        // ============================================================
        function buildToc() {
            const list = document.getElementById('toc-list');
            list.innerHTML = '';
            categoryOrder.forEach(cat => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.className = 'toc-link';
                a.dataset.category = cat;
                a.innerHTML =
                    `<i class="${categoryIcons[cat]}"></i>` +
                    `<span class="toc-name">${categoryNames[cat]}</span>` +
                    `<span class="category-count" id="count-${cat}">0</span>`;
                a.addEventListener('click', handleTocClick);
                li.appendChild(a);
                list.appendChild(li);
            });
        }

        function setActiveToc(cat) {
            if (activeTocCategory === cat) return;
            activeTocCategory = cat;
            document.querySelectorAll('.toc-link').forEach(l => {
                l.classList.toggle('active', l.dataset.category === cat);
            });
        }

        function handleTocClick(e) {
            e.preventDefault();
            const cat = this.dataset.category;
            const container = document.getElementById('websites-container');
            const sec = container.querySelector(`.category-section[data-category="${cat}"]`);
            if (!sec) return;

            const top = sec.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop - 8;
            container.scrollTo({ top: Math.max(top, 0), behavior: 'smooth' });
            setActiveToc(cat);
        }

        function updateActiveToc() {
            const container = document.getElementById('websites-container');
            const sections = Array.from(container.querySelectorAll('.category-section'));
            if (!sections.length) return;

            const cTop = container.getBoundingClientRect().top;
            const threshold = 70;
            let active = sections[0].dataset.category;

            for (const sec of sections) {
                const rect = sec.getBoundingClientRect();
                if (rect.top - cTop <= threshold) {
                    active = sec.dataset.category;
                } else {
                    break;
                }
            }

            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 4) {
                active = sections[sections.length - 1].dataset.category;
            }

            setActiveToc(active);
        }

        // ============================================================
        //  6. 渲染网站列表
        // ============================================================
        function renderWebsites() {
            const container = document.getElementById('websites-container');
            const keepScroll = container.scrollTop;
            container.innerHTML = '';

            if (!websites.length) {
                container.innerHTML =
                    `<div class="no-results"><i class="fas fa-search"></i><div>暂无网站数据</div></div>`;
                return;
            }

            categoryOrder.forEach(cat => {
                const items = websites.filter(w => w.category === cat);
                if (!items.length) return;

                const sec = document.createElement('div');
                sec.className = 'category-section';
                sec.dataset.category = cat;

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML =
                    `<i class="${categoryIcons[cat]}"></i> ${categoryNames[cat]} (${items.length})`;
                sec.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'websites-grid';

                items.forEach(w => {
                    const globalIdx = websites.indexOf(w);
                    grid.appendChild(createCard(w, globalIdx));
                });

                sec.appendChild(grid);
                container.appendChild(sec);
            });

            container.scrollTop = keepScroll;
            updateActiveToc();
        }

        function createCard(website, globalIdx) {
            const today = getToday();
            const visitedMap = getVisitedMap();
            const isVisited = visitedMap[website.url] === today;

            const card = document.createElement('div');
            card.className = 'website-card';
            card.draggable = true;
            card.dataset.index = globalIdx;
            card.dataset.category = website.category;

            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);
            card.addEventListener('dragover', handleDragOver);
            card.addEventListener('dragleave', handleDragLeave);
            card.addEventListener('drop', handleDrop);

            card.innerHTML = `
                <div class="website-icon"><i class="${website.icon}"></i></div>
                <div class="website-info">
                    <div class="website-name" title="${website.name}">${website.name}</div>
                    <div class="website-actions">
                        <button class="visit-btn" data-url="${website.url}">
                            <i class="fas fa-external-link-alt"></i> 访问网站
                        </button>
                        <div class="click-status ${isVisited ? 'clicked' : 'not-clicked'}">
                            ${isVisited ? '今日已点击' : '今日未点击'}
                        </div>
                    </div>
                </div>
                <span class="drag-hint" title="拖动可交换位置"><i class="fas fa-arrows-alt"></i></span>
            `;

            const btn = card.querySelector('.visit-btn');
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                const url = this.dataset.url;
                const map = getVisitedMap();
                map[url] = getToday();
                setVisitedMap(map);
                updateVisitedToday();

                window.open(url, '_blank');

                this.innerHTML = '<i class="fas fa-check"></i> 已访问';
                this.style.backgroundColor = '#1f7044';
                this.style.borderColor = '#1a5f3a';

                const status = this.closest('.website-card').querySelector('.click-status');
                status.textContent = '今日已点击';
                status.className = 'click-status clicked';
            });

            return card;
        }

        // ============================================================
        //  7. 拖拽
        // ============================================================
        function handleDragStart(e) {
            const idx = parseInt(this.dataset.index);
            dragSrcIndex = idx;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(idx));
            e.dataTransfer.setDragImage(this, 30, 30);
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            document.querySelectorAll('.website-card.drag-over')
                .forEach(el => el.classList.remove('drag-over'));
            dragSrcIndex = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            const srcIdx = parseInt(e.dataTransfer.getData('text/plain'));
            const tgtIdx = parseInt(this.dataset.index);

            if (isNaN(srcIdx) || isNaN(tgtIdx) || srcIdx === tgtIdx) return;

            [websites[srcIdx], websites[tgtIdx]] = [websites[tgtIdx], websites[srcIdx]];
            renderWebsites();
        }

        // ============================================================
        //  8. 主题 / 密度
        // ============================================================
        const THEME_KEY = 'dlzb-theme';
        const DENSITY_KEY = 'dlzb-density';
        const THEME_ORDER = ['auto', 'light', 'dark'];

        function getThemePref() {
            return localStorage.getItem(THEME_KEY) || 'auto';
        }

        function applyTheme() {
            const pref = getThemePref();
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const effective = pref === 'auto' ? (systemDark ? 'dark' : 'light') : pref;
            document.documentElement.setAttribute('data-theme', effective);

            const btn = document.getElementById('theme-toggle');
            if (btn) {
                const icon = btn.querySelector('i');
                icon.className = pref === 'auto' ? 'fas fa-circle-half-stroke'
                               : pref === 'light' ? 'fas fa-sun'
                               : 'fas fa-moon';
                const label = pref === 'auto' ? '跟随系统' : pref === 'light' ? '浅色' : '深色';
                btn.title = '主题：' + label + '（点击切换）';
            }
        }

        function applyDensity() {
            const d = localStorage.getItem(DENSITY_KEY) || 'comfortable';
            const compact = d === 'compact';
            document.documentElement.setAttribute('data-density', compact ? 'compact' : 'comfortable');

            const btn = document.getElementById('density-toggle');
            if (btn) {
                btn.querySelector('i').className = compact ? 'fas fa-list' : 'fas fa-table-cells-large';
                btn.title = compact ? '密度：紧凑（点击切换为舒适）' : '密度：舒适（点击切换为紧凑）';
            }
        }

        function setupToolButtons() {
            document.getElementById('theme-toggle').addEventListener('click', () => {
                const cur = getThemePref();
                const next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length];
                localStorage.setItem(THEME_KEY, next);
                applyTheme();
            });

            document.getElementById('density-toggle').addEventListener('click', () => {
                const cur = localStorage.getItem(DENSITY_KEY) || 'comfortable';
                localStorage.setItem(DENSITY_KEY, cur === 'compact' ? 'comfortable' : 'compact');
                applyDensity();
            });

            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            const onChange = () => {
                if (getThemePref() === 'auto') applyTheme();
            };
            if (mq.addEventListener) mq.addEventListener('change', onChange);
            else if (mq.addListener) mq.addListener(onChange);
        }

        // ============================================================
        //  9. 滚动跟随高亮
        // ============================================================
        function setupScrollSpy() {
            const container = document.getElementById('websites-container');
            let ticking = false;

            container.addEventListener('scroll', () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    updateActiveToc();
                    ticking = false;
                });
            }, { passive: true });
        }

        // ============================================================
        //  10. 初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function () {
            updateCurrentDate();
            updateVisitedToday();

            applyTheme();
            applyDensity();
            setupToolButtons();

            buildToc();
            updateCounts();
            renderWebsites();

            setupScrollSpy();

            setActiveToc(categoryOrder[0]);
        });
    </script>
</body>
</html>
